<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ · Validator Yield · Bittensor</title>
<meta name="description" content="How Validator Yield computes APY, τ return, grades, benchmarks, badges and fees for Bittensor validators.">
<meta name="color-scheme" content="dark">
<script src="/ui.js?v=e3d37fbdfb28" data-page="faq"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E13}
a{color:#3DDBB0}a:hover{color:#8CF2D6}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #3DDBB0;outline-offset:2px}
.fq-q:hover{background:#111821 !important}
.fq-toc:hover{color:#E6EDF3 !important}
.fq-swu{height:36px;padding:0 14px;border-radius:999px;background:#F5C542;color:#0A0E13 !important;text-decoration:none;display:flex;align-items:center;font-weight:600;white-space:nowrap}
.fq-swu:hover{background:#FFD866}
@media (max-width:899px){
.fq-toc-wrap,.fq-ui-l{display:none !important}
.fq-main{padding:18px 16px 40px !important}
.fq-hdr{padding:12px 16px !important;gap:10px 14px !important}
.fq-ans{padding:0 16px 16px !important}
.fq-g{display:none !important}
.fq-h1{font-size:24px !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #0A0E13; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased">

<header style="border-bottom: 1px solid #1C232D">
<div class="fq-hdr" style="max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<a href="/" aria-label="Validator Yield, back to choosing a validator" style="display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 10px">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: #3DDBB0; color: #0A0E13; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">τ</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">Validator Yield</span>
</a>
<nav aria-label="Sections" style="display: flex; gap: 6px; flex-wrap: wrap">
<a href="/" style="height: 36px; padding: 0 14px; border-radius: 9px; color: #A9B4C2; text-decoration: none; display: flex; align-items: center">Choose a validator</a>
<a href="/analytics" style="height: 36px; padding: 0 14px; border-radius: 9px; color: #A9B4C2; text-decoration: none; display: flex; align-items: center">Analytics</a>
<a href="/faq" aria-current="page" style="height: 36px; padding: 0 14px; border-radius: 9px; background: #151C26; color: #E6EDF3; text-decoration: none; display: flex; align-items: center; font-weight: 500">FAQ</a>
<a href="/#v/5FFSBkNiymQWHaxc8dTmfTT7iHoz6YDexVG4xR2yLrffVR86" class="fq-swu" title="Kooltek68: the validator behind this site">Stake with us</a>
</nav>
<div style="flex: 1 1 auto"></div>
<div role="group" aria-label="Interface" style="display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #1C232D; border-radius: 10px; background: #0E131A">
<span class="fq-ui-l" style="font-size: 11px; color: #8B97A6; padding: 0 6px; text-transform: uppercase; letter-spacing: 0.08em">UI</span>
<span aria-current="true" style="height: 30px; padding: 0 12px; border-radius: 7px; background: #1A2A26; color: #3DDBB0; font-size: 13px; font-weight: 600; display: flex; align-items: center">Default</span>
<a href="/terminal/faq?ui=terminal" data-on-click="{{toTerminal}}" title="Switch to the Terminal interface" style="height: 30px; padding: 0 12px; border-radius: 7px; color: #A9B4C2; font-size: 13px; font-family: 'JetBrains Mono', monospace; text-decoration: none; display: flex; align-items: center">Terminal</a>
</div>
</div>
</header>

<main class="fq-main" style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<nav aria-label="Topics" class="fq-toc-wrap" style="flex: 0 1 240px; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; color: #8B97A6; text-transform: uppercase; letter-spacing: 0.08em">{{g.name}}</span>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" class="fq-toc" data-on-click="{{it.open}}" style="padding: 2px 0; color: {{it.fg}}; font-size: 13px; text-decoration: none">{{it.q}}</a>
</sc-for>
</div>
</sc-for>
</nav>

<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="display: flex; flex-direction: column; gap: 6px">
<h1 class="fq-h1" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.01em">How the numbers work</h1>
<p style="margin: 0; color: #A9B4C2; max-width: 680px">Short answers on yield, grades and fees. The “?” next to a column or number opens the matching answer here.</p>
</section>
<label style="display: flex">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search questions</span>
<input type="search" value="{{q}}" data-on-input="{{onQ}}" placeholder="Search: grade, fee, unstable…" style="flex: 1; min-width: 0; height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #1C232D; background: #0E131A; color: #E6EDF3">
</label>
<div style="border: 1px solid #1C232D; border-radius: 14px; background: #0E131A; overflow: hidden">
<sc-for list="{{items}}" as="f" hint-placeholder-count="8">
<div id="{{f.id}}" style="border-bottom: 1px solid #141A22; scroll-margin-top: 16px">
<button type="button" class="fq-q" data-on-click="{{f.toggle}}" aria-expanded="{{f.on}}" aria-controls="{{f.aid}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 20px; border: 0; background: {{f.bg}}; color: #E6EDF3; text-align: left">
<span class="fq-g" style="font-size: 11px; color: #8B97A6; width: 56px; flex: none; text-transform: uppercase; letter-spacing: 0.06em">{{f.g}}</span>
<span style="flex: 1; font-weight: 600; font-size: 15px">{{f.q}}</span>
<span aria-hidden="true" style="color: #8B97A6; font-size: 18px">{{f.sign}}</span>
</button>
<sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}">
<div id="{{f.aid}}" class="fq-ans" style="padding: 0 20px 18px 88px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; color: #C9D1D9; max-width: 720px">{{f.a}}</p>
<sc-if value="{{f.ex}}" hint-placeholder-val="{{ false }}">
<code style="align-self: flex-start; max-width: 100%; overflow-x: auto; padding: 6px 10px; border-radius: 8px; background: #0A0E13; border: 1px solid #1C232D; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A9B4C2">{{f.ex}}</code>
</sc-if>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 28px 20px; text-align: center; color: #8B97A6">No question matches “{{q}}”.</p>
</sc-if>
</div>
</div>
</main>
</div>
</template>
<script src="/dc-lite.js?v=0ced284fd338"></script>
<script src="/faq.js?v=9f511fa78099"></script>
</body>
</html>
