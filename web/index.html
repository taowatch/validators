<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validator Yield · Bittensor</title>
<meta name="description" content="Bittensor validators ranked by root-claim and alpha yield, computed from on-chain data.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E13}
a{color:#3DDBB0}a:hover{color:#8CF2D6}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #3DDBB0;outline-offset:2px}
.vr-row:hover{background:#111821 !important}
.vr-chip:hover{border-color:#3A4656 !important;color:#E6EDF3 !important}
.vr-th:hover{color:#E6EDF3 !important}
.vr-card-btn:hover{background:#151C26 !important}
.vr-scroll{scrollbar-width:thin;scrollbar-color:#2A3340 transparent}
@keyframes vrpulse{0%,100%{opacity:.45}50%{opacity:.9}}
.vr-skel{animation:vrpulse 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #0A0E13; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased">

<header style="border-bottom: 1px solid #1C232D; background: #0A0E13">
<div style="max-width: 1360px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 34px; height: 34px; border-radius: 9px; background: {{accent}}; color: #0A0E13; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px" aria-hidden="true">τ</div>
<div style="display: flex; flex-direction: column">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: -0.01em">Validator Yield</span>
<span style="font-size: 12px; color: #8B97A6">Bittensor validators ranked by root and alpha yield</span>
</div>
</div>
<div style="flex: 1 1 auto"></div>
<div title="{{tk.title}}" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 1px solid #1C232D; border-radius: 10px; background: #0E131A">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: #A9B4C2">TAO</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 15px; color: {{tk.flash}}">{{tk.price}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{tk.chgColor}}">{{tk.chg}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8B97A6"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{tk.dot}}" aria-hidden="true"></span>{{tk.status}}</span>
</div>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8B97A6">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}}" aria-hidden="true"></span>
<span>finney · block #{{blockTxt}} · {{timeTxt}}</span>
</div>
</sc-if>
</div>
</header>

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 1360px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 12px">
<div class="vr-skel" style="height: 96px; border-radius: 14px; background: #121821"></div>
<sc-for list="{{skel}}" as="s" hint-placeholder-count="8">
<div class="vr-skel" style="height: 52px; border-radius: 10px; background: #10161E"></div>
</sc-for>
</main>
</sc-if>

<sc-if value="{{failed}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 1360px; margin: 0 auto; padding: 64px 24px">
<p style="margin: 0; color: #F59E3B">Couldn&#39;t load validator data ({{err}}).</p>
</main>
</sc-if>

<sc-if value="{{listView}}" hint-placeholder-val="{{ true }}">
<main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 24px">

<section aria-label="Network overview" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: #1C232D; border: 1px solid #1C232D; border-radius: 14px; overflow: hidden">
<sc-for list="{{stats}}" as="st" hint-placeholder-count="5">
<div style="background: #0E131A; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #8B97A6; text-transform: uppercase; letter-spacing: 0.06em">{{st.label}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: {{st.color}}">{{st.value}}</span>
<span style="font-size: 12px; color: #8B97A6">{{st.sub}}</span>
</div>
</sc-for>
</section>

<div role="tablist" aria-label="Ranking type" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: #0E131A; border: 1px solid #1C232D; border-radius: 12px; align-self: flex-start; max-width: 100%; box-sizing: border-box">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.pick}}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 9px; background: {{tb.bg}}; color: {{tb.fg}}; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px">{{tb.label}}<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: {{tb.countBg}}">{{tb.count}}</span></button>
</sc-for>
</div>

<sc-if value="{{showSample}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border: 1px solid #3A2C14; background: #1A140B; border-radius: 12px; font-size: 13px; color: #E8C79A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F59E3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
<span>Sample data: alpha pools of 8 large validators across {{alSnCount}} subnets, measured at block #{{alBlock}}. The full-network run (≈5,000 validator–subnet pools) replaces this file without layout changes.</span>
</div>
</sc-if>

<sc-if value="{{isRoot}}" hint-placeholder-val="{{ true }}">
<section aria-label="Analysis" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px">

<div style="background: #0E131A; border: 1px solid #1C232D; border-radius: 14px; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px">Commission eats into yield</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B97A6">APY {{winLabel}} × take</span>
</div>
<div style="position: relative; height: 220px; margin: 0 0 18px 34px; border-left: 1px solid #222B36; border-bottom: 1px solid #222B36">
<sc-for list="{{sc.yTicks}}" as="tk" hint-placeholder-count="4">
<div style="position: absolute; left: 0; right: 0; bottom: {{tk.pos}}%; border-top: 1px dashed #1A212B">
<span style="position: absolute; left: -36px; top: -8px; width: 30px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8B97A6">{{tk.label}}</span>
</div>
</sc-for>
<sc-for list="{{sc.xTicks}}" as="tk" hint-placeholder-count="5">
<span style="position: absolute; bottom: -18px; left: {{tk.pos}}%; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8B97A6">{{tk.label}}</span>
</sc-for>
<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible" aria-hidden="true">
<path d="{{sc.trend}}" fill="none" stroke="#F59E3B" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></path>
</svg>
<sc-for list="{{sc.pts}}" as="p" hint-placeholder-count="20">
<button type="button" aria-label="{{p.aria}}" onClick="{{p.open}}" onMouseEnter="{{p.enter}}" onMouseLeave="{{p.leave}}" style="position: absolute; left: calc({{p.x}}% - {{p.half}}px); bottom: calc({{p.y}}% - {{p.half}}px); width: {{p.size}}px; height: {{p.size}}px; border-radius: 50%; padding: 0; border: 1px solid {{p.stroke}}; background: {{p.fill}}"></button>
</sc-for>
<sc-if value="{{sc.hasTip}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: {{sc.tip.x}}%; bottom: calc({{sc.tip.y}}% + 14px); transform: translateX({{sc.tip.shift}}); background: #1A222D; border: 1px solid #2A3442; border-radius: 8px; padding: 8px 10px; pointer-events: none; white-space: nowrap; z-index: 2">
<div style="font-weight: 600; font-size: 13px">{{sc.tip.name}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A9B4C2">APY {{sc.tip.apy}} · take {{sc.tip.take}} · {{sc.tip.stake}} τ</div>
</div>
</sc-if>
</div>
<p style="margin: 0; font-size: 12px; color: #A9B4C2">Trend line: every <b style="color: #E6EDF3">1% of take</b> moves APY by <b style="color: #F59E3B">{{sc.slopeTxt}}</b>. Dot size = root stake. Click a dot for details.</p>
</div>

<div style="background: #0E131A; border: 1px solid #1C232D; border-radius: 14px; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px">APY {{winLabel}} distribution</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B97A6">{{hist.n}} validators</span>
</div>
<div style="position: relative; height: 220px; margin-bottom: 18px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid #222B36">
<sc-for list="{{hist.bins}}" as="b" hint-placeholder-count="14">
<div title="{{b.title}}" style="flex: 1 1 0; height: {{b.h}}%; min-height: 2px; background: {{b.fill}}; border-radius: 4px 4px 0 0; position: relative">
<span style="position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #A9B4C2">{{b.count}}</span>
<span style="position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8B97A6">{{b.label}}</span>
</div>
</sc-for>
<div style="position: absolute; top: 0; bottom: 0; left: {{hist.medPos}}%; border-left: 2px solid #7AA2F7">
<span style="position: absolute; top: 0; left: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7AA2F7; white-space: nowrap; background: #0E131A; padding: 0 4px">median {{hist.medTxt}}</span>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #A9B4C2">Top 10% earn above <b style="color: {{accent}}">{{hist.p90}}</b>, bottom 10% earn below <b style="color: #F59E3B">{{hist.p10}}</b>. That is a {{hist.spread}} yearly gap from validator choice alone.</p>
</div>

<div style="background: #0E131A; border: 1px solid #1C232D; border-radius: 14px; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px">{{flows.title}}</h2>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B97A6">Δ root stake</span>
</div>
<span style="font-size: 11px; color: #8B97A6; text-transform: uppercase; letter-spacing: 0.06em">Inflows</span>
<sc-for list="{{flows.inn}}" as="f" hint-placeholder-count="4">
<button type="button" class="vr-card-btn" onClick="{{f.open}}" style="display: grid; grid-template-columns: minmax(0, 1fr) 96px 92px; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; background: transparent; border: 0; border-radius: 8px; color: inherit; text-align: left">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500">{{f.name}}</span>
<span style="height: 6px; border-radius: 3px; background: #18202A; overflow: hidden"><span style="display: block; height: 100%; width: {{f.w}}%; background: {{accent}}; border-radius: 3px"></span></span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{accent}}">{{f.txt}}</span>
</button>
</sc-for>
<span style="font-size: 11px; color: #8B97A6; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px">Outflows</span>
<sc-for list="{{flows.out}}" as="f" hint-placeholder-count="3">
<button type="button" class="vr-card-btn" onClick="{{f.open}}" style="display: grid; grid-template-columns: minmax(0, 1fr) 96px 92px; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; background: transparent; border: 0; border-radius: 8px; color: inherit; text-align: left">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500">{{f.name}}</span>
<span style="height: 6px; border-radius: 3px; background: #18202A; overflow: hidden"><span style="display: block; height: 100%; width: {{f.w}}%; background: #F59E3B; border-radius: 3px"></span></span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #F59E3B">{{f.txt}}</span>
</button>
</sc-for>
</div>

</section>

<section aria-label="Rankings" style="background: #0E131A; border: 1px solid #1C232D; border-radius: 14px; overflow: hidden">
<div style="padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; border-bottom: 1px solid #1C232D">
<label style="flex: 1 1 280px; position: relative; display: flex; align-items: center">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search validators</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B97A6" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 12px" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Search by name, hotkey or coldkey…" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 38px; background: #0A0E13; border: 1px solid #232C38; border-radius: 10px; color: #E6EDF3; font: inherit; font-size: 14px">
</label>
<div role="group" aria-label="APY window" style="display: flex; gap: 4px; padding: 4px; background: #0A0E13; border: 1px solid #232C38; border-radius: 10px">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="3">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="height: 34px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 7px; background: {{w.bg}}; color: {{w.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600">{{w.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="Minimum stake" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{mins}}" as="m" hint-placeholder-count="4">
<button type="button" class="vr-chip" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 12px; font-weight: 500">{{m.label}}</button>
</sc-for>
</div>
<button type="button" class="vr-chip" aria-pressed="{{hideTake}}" onClick="{{toggleTake}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{takeChip.border}}; background: {{takeChip.bg}}; color: {{takeChip.fg}}; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px">
<span style="width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid {{takeChip.fg}}; display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1">{{takeChip.mark}}</span>Hide take &gt; 10%</button>
</div>

<div style="padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; font-size: 12px; color: #8B97A6; border-bottom: 1px solid #1C232D">
<span><b style="color: #E6EDF3">{{countTxt}}</b> validators match · median APY {{winLabel}} <b style="color: #7AA2F7">{{medTxt}}</b></span>
<span>APY net of commission · marked at current share price</span>
</div>

<div class="vr-scroll" style="overflow-x: auto">
<div style="min-width: 1180px">
<div style="display: grid; grid-template-columns: 52px minmax(220px, 2.4fr) minmax(150px, 1.3fr) 64px 80px 80px 86px 112px 116px 80px 84px; gap: 12px; align-items: center; padding: 0 20px; height: 40px; background: #0B1016; border-bottom: 1px solid #1C232D">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="11">
<div style="display: flex; justify-content: {{c.justify}}">
<sc-if value="{{c.sortable}}" hint-placeholder-val="{{ true }}">
<button type="button" class="vr-th" onClick="{{c.sort}}" aria-label="{{c.aria}}" style="background: transparent; border: 0; padding: 0; height: 40px; display: flex; align-items: center; gap: 4px; color: {{c.color}}; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap">{{c.label}}<span style="font-family: 'JetBrains Mono', monospace">{{c.arrow}}</span></button>
</sc-if>
<sc-if value="{{c.plain}}" hint-placeholder-val="{{ false }}">
<span style="color: #8B97A6; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap">{{c.label}}</span>
</sc-if>
</div>
</sc-for>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<button type="button" class="vr-row" onClick="{{r.open}}" aria-label="{{r.aria}}" style="width: 100%; display: grid; grid-template-columns: 52px minmax(220px, 2.4fr) minmax(150px, 1.3fr) 64px 80px 80px 86px 112px 116px 80px 84px; gap: 12px; align-items: center; padding: 0 20px; height: 60px; background: transparent; border: 0; border-bottom: 1px solid #161C25; color: inherit; text-align: left">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{r.rankColor}}; font-weight: 600">{{r.rank}}</span>
<span style="display: flex; align-items: center; gap: 12px; min-width: 0">
<span style="flex: none; width: 34px; height: 34px; border-radius: 9px; background: {{r.monoBg}}; color: {{r.monoFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px" aria-hidden="true">{{r.ini}}</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{r.nameColor}}">{{r.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B97A6">{{r.short}}</span>
</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">{{r.stake}} <span style="color: #8B97A6">τ</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B97A6">{{r.stakeUsd}}</span>
<span style="width: 100%; max-width: 140px; height: 3px; border-radius: 2px; background: #18202A; overflow: hidden"><span style="display: block; height: 100%; width: {{r.stakeBar}}%; background: #3B4A5E"></span></span>
</span>
<span style="justify-self: end; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: {{r.takeBg}}; color: {{r.takeFg}}">{{r.take}}</span>
<span style="justify-self: stretch; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{r.c1.color}}; font-weight: {{r.c1.weight}}">{{r.c1.t}}</span>
<span style="justify-self: stretch; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{r.c7.color}}; font-weight: {{r.c7.weight}}">{{r.c7.t}}</span>
<span style="justify-self: stretch; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{r.c30.color}}; font-weight: {{r.c30.weight}}">{{r.c30.t}}</span>
<svg viewBox="0 0 100 28" preserveAspectRatio="none" style="width: 112px; height: 28px; overflow: visible" aria-hidden="true">
<line x1="0" x2="100" y1="{{r.medY}}" y2="{{r.medY}}" stroke="#2A3646" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"></line>
<path d="{{r.spark}}" fill="none" stroke="{{r.sparkColor}}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
</svg>
<span style="text-align: right; display: flex; flex-direction: column; align-items: flex-end">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{r.flowColor}}">{{r.flow}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B97A6">{{r.flowPct}}</span>
</span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{r.sdColor}}">{{r.sd}}</span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A9B4C2">{{r.nom}}</span>
</button>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 48px 20px; text-align: center; color: #8B97A6">No validators match. Try loosening the filters.</div>
</sc-if>
</div>
</div>
