<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a validator · Validator Yield · Bittensor</title>
<meta name="description" content="Pick a Bittensor validator: every root and subnet validator graded on what it pays stakers, after fees, from on-chain data.">
<meta name="color-scheme" content="dark">
<script src="/ui.js?v=e3d37fbdfb28" data-page="index"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E13}
a{color:#3DDBB0}a:hover{color:#8CF2D6}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #3DDBB0;outline-offset:2px}
.ch-row:hover{background:#111821 !important}
.ch-chip:hover{border-color:#3A4656 !important;color:#E6EDF3 !important}
.ch-mode:hover{border-color:#2E3A49 !important}
.sp-tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sp-card:hover{border-color:#2E3A49 !important}
.sp-dot:hover{outline:2px solid #E6EDF3}
.sp-chk:hover{color:#E6EDF3 !important}
.sp-th:hover{color:#E6EDF3 !important}
.ch-skip{position:absolute;left:-9999px;top:8px;padding:8px 12px;border-radius:8px;background:#3DDBB0;color:#0A0E13;font-weight:600;z-index:10}
.ch-skip:focus{left:16px}
@keyframes chpulse{0%,100%{opacity:.45}50%{opacity:.9}}
.ch-skel{animation:chpulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ch-skel{animation:none}}
.ch-cards{display:none}
.ch-short{display:none}
.ch-sorth{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:4px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.ch-sorth:hover{color:#E6EDF3}
.ch-sorth:focus-visible{outline:2px solid #3DDBB0;outline-offset:2px}
.ch-ava{flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Space Grotesk',sans-serif;font-weight:700}
.ch-ava img{width:100%;height:100%;object-fit:cover;display:block}
.ch-sn{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;background:#16223A;color:#8FB0FF;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.ch-swu{height:36px;padding:0 14px;border-radius:999px;background:#F5C542;color:#0A0E13 !important;text-decoration:none;display:flex;align-items:center;font-weight:600;white-space:nowrap}
.ch-swu:hover{background:#FFD866}
.ch-msort{display:none}
.ch-q{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:4px;border-radius:50%;border:1px solid #2A3340;color:#8B97A6 !important;font-size:10px;font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;vertical-align:middle}
.ch-q:hover{border-color:#3DDBB0;color:#3DDBB0 !important}
@media (max-width:1499px){.ch-block{display:none !important}}
@media (max-width:899px){
.ch-table{display:none !important}
.ch-cards{display:block}
.ch-msort{display:flex}
.ch-main{padding:18px 16px 40px !important;gap:14px !important}
.ch-hdr{padding:12px 16px !important;gap:10px 14px !important}
.ch-sub,.ch-block{display:none !important}
.ch-h1{font-size:24px !important}
.ch-modes{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:8px !important}
.ch-mode{padding:10px 12px !important;border-radius:12px !important}
.ch-mode-title{font-size:15px !important}
.ch-long{display:none !important}
.ch-short{display:block}
.ch-snsel{min-width:0 !important;flex:1 1 100% !important}
.sp-picks{grid-template-columns:1fr !important}
.sp-ctl{flex-direction:column;align-items:stretch !important}
.sp-seg{overflow-x:auto}.sp-seg button{flex:1 0 auto;padding:0 8px !important;font-size:12px !important}
.ch-sum{padding:12px 14px !important;gap:10px 20px !important}
.ch-sum-v{font-size:15px !important}
.ch-chips{flex-wrap:nowrap !important;overflow-x:auto}
.ch-chips button{flex:none}
.vd-tabs{flex-wrap:nowrap !important;overflow-x:auto}
.vd-tabs button{flex:none}
.vd-kv{font-size:20px !important}
.vd-h1{font-size:22px !important}
.vd-ava{display:none !important}
.ch-ui-l{display:none !important}
.ch-sum>div{min-width:0 !important;flex:1 1 40%}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #0A0E13; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased">
<a href="#validators" class="ch-skip" data-on-click="{{skip}}">Skip to validators</a>

<header style="border-bottom: 1px solid #1C232D">
<div class="ch-hdr" style="max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<a href="/" data-on-click="{{home}}" aria-label="Validator Yield, back to choosing a validator" style="display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 10px">
<span style="width: 34px; height: 34px; border-radius: 9px; background: {{accent}}; color: #0A0E13; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px" aria-hidden="true">τ</span>
<span style="display: flex; flex-direction: column">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">Validator Yield</span>
<span class="ch-sub" style="font-size: 12px; color: #8B97A6">Pick where to stake your TAO</span>
</span>
</a>
<nav aria-label="Sections" style="display: flex; gap: 6px; flex-wrap: wrap">
<a href="/" data-on-click="{{home}}" aria-current="page" style="height: 36px; padding: 0 14px; border-radius: 9px; background: #151C26; color: #E6EDF3; text-decoration: none; display: flex; align-items: center; font-weight: 500">Choose a validator</a>
<a href="/analytics" style="height: 36px; padding: 0 14px; border-radius: 9px; color: #A9B4C2; text-decoration: none; display: flex; align-items: center">Analytics</a>
<a href="/faq" style="height: 36px; padding: 0 14px; border-radius: 9px; color: #A9B4C2; text-decoration: none; display: flex; align-items: center">FAQ</a>
<a href="#v/5FFSBkNiymQWHaxc8dTmfTT7iHoz6YDexVG4xR2yLrffVR86" class="ch-swu" data-on-click="{{stakeUs}}" title="Kooltek68: the validator behind this site">Stake with us</a>
</nav>
<div style="flex: 1 1 auto"></div>
<div role="group" aria-label="Interface" class="ch-ui" style="display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #1C232D; border-radius: 10px; background: #0E131A">
<span class="ch-ui-l" style="font-size: 11px; color: #8B97A6; padding: 0 6px; text-transform: uppercase; letter-spacing: 0.08em">UI</span>
<span aria-current="true" style="height: 30px; padding: 0 12px; border-radius: 7px; background: #1A2A26; color: #3DDBB0; font-size: 13px; font-weight: 600; display: flex; align-items: center">Default</span>
<a href="/terminal?ui=terminal" data-on-click="{{toTerminal}}" title="Switch to the Terminal interface (t)" style="height: 30px; padding: 0 12px; border-radius: 7px; color: #A9B4C2; font-size: 13px; font-family: 'JetBrains Mono', monospace; text-decoration: none; display: flex; align-items: center">Terminal</a>
</div>
<div title="{{tk.title}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border: 1px solid #1C232D; border-radius: 10px; background: #0E131A">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: #A9B4C2">TAO</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; color: {{tk.flash}}">{{tk.price}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{tk.chgColor}}">{{tk.chg}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8B97A6"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{tk.dot}}" aria-hidden="true"></span>{{tk.status}}</span>
</div>
<span class="ch-block" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8B97A6">finney · block #{{blockTxt}}</span>
</div>
</header>

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<main class="ch-main" style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 12px">
<div class="ch-skel" style="height: 40px; width: 280px; border-radius: 10px; background: #121821"></div>
<div class="ch-skel" style="height: 96px; border-radius: 14px; background: #121821"></div>
<sc-for list="{{skel}}" as="s" hint-placeholder-count="8">
<div class="ch-skel" style="height: 56px; border-radius: 10px; background: #10161E"></div>
</sc-for>
</main>
</sc-if>

<sc-if value="{{failed}}" hint-placeholder-val="{{ false }}">
<main class="ch-main" style="max-width: 1280px; margin: 0 auto; padding: 64px 24px">
<p style="margin: 0; color: #F5A524">Couldn&#39;t load validator data ({{err}}). The collector may still be taking its first snapshot; try again in a minute.</p>
</main>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<main class="ch-main" style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 20px">

<section style="display: flex; flex-direction: column; gap: 6px">
<h1 class="ch-h1" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.01em">Choose a validator</h1>
<p style="margin: 0; color: #A9B4C2; max-width: 760px">Pick Root or a subnet, then a validator. Grades compare payouts with the best validators in the same place.</p>
</section>

<section aria-label="Where to stake" class="ch-modes" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px">
<button type="button" class="ch-mode" data-on-click="{{pickRoot}}" aria-pressed="{{rootOn}}" style="text-align: left; padding: 18px 20px; border-radius: 14px; border: 1.5px solid {{rootBorder}}; background: {{rootBg}}; color: #E6EDF3; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px">
<span class="ch-mode-title" style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">Keep τ (Root)</span>
<span class="ch-long" style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: {{accent}}">~{{rootBench}}% APY</span>
</span>
<span class="ch-long" style="color: #A9B4C2; font-size: 13px">Your principal stays in TAO. Rewards arrive as basket alpha. Lower yield, no alpha price risk.</span>
<span class="ch-short" style="color: #A9B4C2; font-size: 12px">~{{rootBench}}% · no price risk</span>
</button>
<button type="button" class="ch-mode" data-on-click="{{pickAlpha}}" aria-pressed="{{alphaOn}}" style="text-align: left; padding: 18px 20px; border-radius: 14px; border: 1.5px solid {{alphaBorder}}; background: {{alphaBg}}; color: #E6EDF3; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px">
<span class="ch-mode-title" style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">Stake in a subnet</span>
<span class="ch-long" style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #E6EDF3">{{alphaRange}}</span>
</span>
<span class="ch-long" style="color: #A9B4C2; font-size: 13px">Higher yield paid in the subnet&#39;s alpha. Your principal moves with that alpha&#39;s price (median 30D: {{medDp}}).</span>
<span class="ch-short" style="color: #A9B4C2; font-size: 12px">paid in alpha · price risk</span>
</button>
</section>

<sc-if value="{{alphaOn}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Steps" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px">
<sc-if value="{{sp.on}}" hint-placeholder-val="{{ true }}">
<span aria-current="step" style="display: flex; align-items: center; gap: 8px; color: #E6EDF3; font-weight: 600"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; background: {{accent}}; color: #0A0E13; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">1</span>Pick a subnet</span>
</sc-if>
<sc-if value="{{sp.off}}" hint-placeholder-val="{{ false }}">
<button type="button" class="ch-chip" data-on-click="{{toSubnets}}" style="height: 30px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid #1C232D; background: transparent; color: #A9B4C2; display: flex; align-items: center; gap: 8px; font-size: 13px"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; background: #12281F; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 11px">✓</span>← All subnets</button>
</sc-if>
<span aria-hidden="true" style="color: #3A4656">──</span>
<span style="display: flex; align-items: center; gap: 8px; color: {{sp.step2Fg}}; font-weight: {{sp.step2W}}"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 1px solid {{sp.step2Bd}}; background: {{sp.step2Bg}}; color: {{sp.step2NumFg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">2</span>Pick a validator on it</span>
</nav>
<section aria-label="Subnet" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<label for="ch-sn" style="font-size: 13px; color: #A9B4C2">{{sp.snLabel}}</label>
<div class="ch-snsel" style="position: relative; min-width: 380px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid {{snBorder}}; background: #0E131A">
<sc-if value="{{snCur}}" hint-placeholder-val="{{ false }}">
<span class="ch-ava" aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: {{snCur.av.bg}}; color: {{snCur.av.fg}}; font-size: 9px">
<sc-if value="{{snCur.av.img}}" hint-placeholder-val="{{ false }}"><img src="{{snCur.av.src}}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" data-on-error="{{snCur.av.err}}"></sc-if>
<sc-if value="{{snCur.av.mono}}" hint-placeholder-val="{{ true }}">{{snCur.av.ini}}</sc-if>
</span>
<span style="flex: none; padding: 2px 7px; border-radius: 6px; background: #12281F; color: #3DDBB0; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">{{snCur.sn}}</span>
</sc-if>
<input id="ch-sn" type="text" role="combobox" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-expanded="{{snOpen}}" aria-controls="ch-snlist" aria-activedescendant="{{snActId}}" aria-label="Search subnets by number or name" placeholder="{{snPh}}" value="{{snQ}}" data-on-change="{{onSnQ}}" data-on-focus="{{openSn}}" data-on-blur="{{closeSn}}" data-on-keydown="{{snKey}}" style="flex: 1; min-width: 0; height: 36px; border: 0; outline: none; background: transparent; color: #E6EDF3; font-size: 14px">
<sc-if value="{{snOpen}}" hint-placeholder-val="{{ false }}">
<ul id="ch-snlist" role="listbox" aria-label="Subnets" style="position: absolute; top: 44px; left: 0; right: 0; z-index: 30; margin: 0; padding: 4px; list-style: none; max-height: 360px; overflow-y: auto; border-radius: 10px; border: 1px solid #2A3340; background: #0E131A; box-shadow: 0 12px 32px rgba(0,0,0,0.45)">
<sc-for list="{{snMatches}}" as="o" hint-placeholder-count="6">
<li id="{{o.id}}" role="option" aria-selected="{{o.act}}" data-on-mousedown="{{o.pick}}" style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; background: {{o.bg}}">
<span class="ch-ava" aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: {{o.av.bg}}; color: {{o.av.fg}}; font-size: 9px">
<sc-if value="{{o.av.img}}" hint-placeholder-val="{{ false }}"><img src="{{o.av.src}}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" data-on-error="{{o.av.err}}"></sc-if>
<sc-if value="{{o.av.mono}}" hint-placeholder-val="{{ true }}">{{o.av.ini}}</sc-if>
</span>
<span style="flex: none; min-width: 52px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: {{o.snC}}">{{o.sn}}</span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #E6EDF3; font-size: 14px">{{o.name}}</span>
<span style="flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A9B4C2">{{o.best}}</span>
<span style="flex: none; min-width: 62px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8B97A6">{{o.dp}}</span>
</li>
</sc-for>
<sc-if value="{{snNone}}" hint-placeholder-val="{{ false }}">
<li role="option" aria-disabled="true" aria-selected="false" style="padding: 10px 8px; color: #A9B4C2; font-size: 13px">{{snNoneTxt}}</li>
</sc-if>
</ul>
</sc-if>
</div>
<span class="ch-long" style="font-size: 12px; color: #8B97A6">Type a number (51, sn51) or a name. Up/Down to move, Enter to pick.</span>
</section>
</sc-if>

<sc-if value="{{sp.on}}" hint-placeholder-val="{{ false }}">
<section aria-label="What moved stake value on subnets" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px">
<sc-for list="{{sp.facts}}" as="f" hint-placeholder-count="3">
<div style="padding: 14px 16px; border-radius: 12px; border: 1px solid #1C232D; background: #0E131A; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #8B97A6">{{f.label}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; color: {{f.color}}">{{f.value}}</span>
<span style="font-size: 12px; color: #8B97A6">{{f.sub}}</span>
</div>
</sc-for>
</section>

<section aria-label="Your stake" style="padding: 16px 20px; border-radius: 14px; border: 1px solid #1C232D; background: #0E131A; display: flex; flex-direction: column; gap: 14px">
<div class="sp-ctl" style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center">
<label style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #A9B4C2">I want to stake</span>
<span style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #232C38; background: #0A0E13">
<input type="text" inputmode="decimal" value="{{amt}}" data-on-input="{{onAmt}}" aria-label="Amount of TAO to stake" style="width: 90px; border: 0; outline: none; background: transparent; color: #E6EDF3; font-family: 'JetBrains Mono', monospace; font-size: 15px; text-align: right">
<span style="margin-left: 6px; color: #8B97A6">τ</span>
</span>
</label>
<sc-if value="{{sp.hasWins}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 13px; color: #A9B4C2">Look back</span>
<div role="group" aria-label="Look-back window" class="sp-seg" style="display: flex; gap: 2px; padding: 3px; background: #0A0E13; border: 1px solid #232C38; border-radius: 10px">
<sc-for list="{{sp.wins}}" as="w" hint-placeholder-count="2">
<button type="button" aria-pressed="{{w.on}}" data-on-click="{{w.pick}}" style="height: 32px; min-width: 52px; padding: 0 10px; border: 0; border-radius: 7px; background: {{w.bg}}; color: {{w.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600">{{w.label}}</button>
</sc-for>
</div></div>
</sc-if>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 13px; color: #A9B4C2">I care most about</span>
<div role="group" aria-label="What matters most" class="sp-seg" style="display: flex; gap: 2px; padding: 3px; background: #0A0E13; border: 1px solid #232C38; border-radius: 10px">
<sc-for list="{{sp.modes}}" as="m" hint-placeholder-count="3">
<button type="button" aria-pressed="{{m.on}}" data-on-click="{{m.pick}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: {{m.bg}}; color: {{m.fg}}; font-size: 13px; font-weight: 600; white-space: nowrap">{{m.label}}</button>
</sc-for>
</div></div>
</div>
<p style="margin: 0; font-size: 13px; color: #A9B4C2">{{sp.modeNote}}</p>
</section>

<section aria-label="Root for comparison" style="padding: 14px 20px; border-radius: 14px; border: 1px solid #1E2C44; background: #0D1320; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7AA2F7">Root, for comparison</span>
<span><span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #E6EDF3">{{sp.root.ret}}</span> <span style="color: #8B97A6">in τ over {{sp.winLbl}}</span></span>
<span style="color: #8B97A6">{{sp.root.apy}} APY · paid in τ · no price risk · on {{sp.amtTxt}} τ ≈ <b style="color: #E6EDF3">{{sp.root.tao}} τ</b></span>
<button type="button" class="ch-chip" data-on-click="{{pickRoot}}" style="margin-left: auto; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #1E2C44; background: transparent; color: #7AA2F7; font-size: 13px">See Root validators ›</button>
</section>

<section aria-label="Top picks" style="display: flex; flex-direction: column; gap: 12px">

<div style="padding: 14px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-bottom: 1px solid #1C232D">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600">Where it operates</h2>
<span style="font-size: 12px; color: #8B97A6">{{d.placesNote}}</span>
</div>
<div class="ch-msort" style="align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #1C232D">
<label for="ch-psort" style="font-size: 12px; color: #8B97A6">Sort by</label>
<select id="ch-psort" value="{{d.pmsortVal}}" data-on-change="{{d.pickPmsort}}" style="flex: 1; min-width: 0; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid #1C232D; background: #0A0E13; color: #E6EDF3">
<sc-for list="{{d.pmsortOpts}}" as="o" hint-placeholder-count="6">
<option value="{{o.v}}">{{o.label}}</option>
</sc-for>
</select>
</div>
<div style="overflow-x: auto">
<div style="min-width: 620px">
<div style="display: grid; grid-template-columns: minmax(180px, 2fr) 60px 100px 100px 90px 110px; gap: 12px; padding: 0 20px; height: 36px; align-items: center; background: #0B1016; border-bottom: 1px solid #1C232D; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8B97A6">
<span>Where</span>
<span style="display: flex"><button type="button" class="ch-sorth" data-on-click="{{d.ps.g.pick}}" aria-pressed="{{d.ps.g.on}}" aria-label="{{d.ps.g.aria}}" style="color: {{d.ps.g.color}}">Grade<span aria-hidden="true">{{d.ps.g.arrow}}</span></button></span>
<span style="display: flex; justify-content: flex-end"><button type="button" class="ch-sorth" data-on-click="{{d.ps.a30.pick}}" aria-pressed="{{d.ps.a30.on}}" aria-label="{{d.ps.a30.aria}}" style="color: {{d.ps.a30.color}}; white-space: nowrap">APY 30D<span aria-hidden="true">{{d.ps.a30.arrow}}</span></button></span>
<span style="display: flex; justify-content: flex-end"><button type="button" class="ch-sorth" data-on-click="{{d.ps.pr.pick}}" aria-pressed="{{d.ps.pr.on}}" aria-label="{{d.ps.pr.aria}}" style="color: {{d.ps.pr.color}}">Payout<span aria-hidden="true">{{d.ps.pr.arrow}}</span></button></span>
<span style="display: flex; justify-content: flex-end"><button type="button" class="ch-sorth" data-on-click="{{d.ps.fee.pick}}" aria-pressed="{{d.ps.fee.on}}" aria-label="{{d.ps.fee.aria}}" style="color: {{d.ps.fee.color}}">Fee<span aria-hidden="true">{{d.ps.fee.arrow}}</span></button></span>
<span style="display: flex; justify-content: flex-end"><button type="button" class="ch-sorth" data-on-click="{{d.ps.stake.pick}}" aria-pressed="{{d.ps.stake.on}}" aria-label="{{d.ps.stake.aria}}" style="color: {{d.ps.stake.color}}">Stake<span aria-hidden="true">{{d.ps.stake.arrow}}</span></button></span>
</div>
<sc-for list="{{d.places}}" as="p" hint-placeholder-count="5">
<button type="button" class="ch-row" data-on-click="{{p.pick}}" aria-pressed="{{p.on}}" style="width: 100%; text-align: left; color: inherit; border: 0; border-bottom: 1px solid #141A22; display: grid; grid-template-columns: minmax(180px, 2fr) 60px 100px 100px 90px 110px; gap: 12px; padding: 0 20px; height: 44px; align-items: center; background: {{p.bg}}">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0">
<sc-if value="{{p.av}}" hint-placeholder-val="{{ false }}"><span class="ch-ava" aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: {{p.av.bg}}; color: {{p.av.fg}}; font-size: 9px">
<sc-if value="{{p.av.img}}" hint-placeholder-val="{{ false }}"><img src="{{p.av.src}}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" data-on-error="{{p.av.err}}"></sc-if>
<sc-if value="{{p.av.mono}}" hint-placeholder-val="{{ true }}">{{p.av.ini}}</sc-if>
</span></sc-if>
<sc-if value="{{p.isSn}}" hint-placeholder-val="{{ true }}"><span class="ch-sn">{{p.label}}</span></sc-if>
<sc-if value="{{p.isRoot}}" hint-placeholder-val="{{ false }}"><b>{{p.label}}</b></sc-if>
<span style="color: #8B97A6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.sname}}</span>
</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: {{p.gFg}}">{{p.grade}}</span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace">{{p.apy}}</span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace; color: {{p.gFg}}">{{p.pr}}</span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace; color: {{p.feeColor}}">{{p.fee}}</span>
<span style="text-align: right; font-family: 'JetBrains Mono', monospace">{{p.stake}}</span>
</button>
</sc-for>
</div>
</div>
<sc-if value="{{d.placesMore}}" hint-placeholder-val="{{ false }}">
<div style="padding: 12px 20px; display: flex; justify-content: center; border-top: 1px solid #1C232D">
<button type="button" class="ch-chip" data-on-click="{{d.showAllPlaces}}" style="height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid #2A3340; background: transparent; color: #E6EDF3">Show all {{d.placesTotal}}</button>
</div>
</sc-if>
</section>
</sc-if>
</main>
</sc-if>
</div>
</template>
<script src="/dc-lite.js?v=0ced284fd338"></script>
<script src="/app.js?v=f2f46de5975b"></script>
</body>
</html>
