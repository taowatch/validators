<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal · Validator Yield · Bittensor</title>
<meta name="description" content="Bittensor validators graded on what they pay stakers, in a keyboard-driven terminal view.">
<meta name="color-scheme" content="dark">
<script src="/ui.js?v=e3d37fbdfb28" data-page="terminal"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090A}
a{color:#4BE38A}a:hover{color:#9DF5BF}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #4BE38A;outline-offset:1px}
.tm-btn:hover{border-color:#4BE38A !important;color:#E8F2EA !important}
.tm-row:hover{background:#0D1411 !important}
.tm-name{color:#E8F2EA;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-name:hover{color:#4BE38A}
.tm-caret{display:inline-block;width:9px;height:17px;background:#4BE38A;vertical-align:text-bottom;animation:tmblink 1.1s steps(1) infinite}
@keyframes tmblink{50%{opacity:0}}
@keyframes tmpulse{0%,100%{opacity:.35}50%{opacity:.8}}
.tm-skel{animation:tmpulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.tm-caret,.tm-skel{animation:none}}
.tm-cards,.tm-msort{display:none}
@media (max-width:899px){
.tm-table,.tm-hint{display:none !important}
.tm-snrows{max-height:260px !important}
.tm-cards{display:block}
.tm-msort{display:flex}
.tm-aside{max-width:none !important}
.tm-main{padding:10px 12px 16px !important}
.tm-hdr{padding:8px 12px !important}
.tm-kv{grid-template-columns:150px minmax(0,1fr) !important}
.tm-status{position:static !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #07090A; color: #D4DDD6; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column">

<header style="border-bottom: 1px solid #1E2622; background: #07090A">
<div class="tm-hdr" style="max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px">
<a href="/terminal" data-on-click="{{home}}" aria-label="Validator Yield, back to choosing a validator" style="color: #4BE38A; text-decoration: none; font-weight: 700; letter-spacing: 0.02em">▌validator-yield</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<a href="/terminal" data-on-click="{{home}}" aria-current="{{chooseCur}}" style="padding: 4px 10px; border: 1px solid {{chooseBorder}}; color: #E8F2EA; text-decoration: none">[ choose ]</a>
<a href="/terminal/analytics" style="padding: 4px 10px; color: #A9B6AD; text-decoration: none">analytics</a>
<a href="/terminal/faq" style="padding: 4px 10px; color: #A9B6AD; text-decoration: none">faq</a>
<a href="#v/5FFSBkNiymQWHaxc8dTmfTT7iHoz6YDexVG4xR2yLrffVR86" data-on-click="{{stakeUs}}" title="Kooltek68: the validator behind this site" style="padding: 4px 10px; background: #F2B544; color: #0A0C0B; text-decoration: none; font-weight: 700">STAKE WITH US</a>
</nav>
<div style="flex: 1 1 auto"></div>
<div role="group" aria-label="Interface" style="display: flex; align-items: center">
<span style="color: #8A978E; padding-right: 8px; text-transform: uppercase; letter-spacing: 0.08em">UI</span>
<a href="/?ui=default" data-on-click="{{toDefault}}" style="padding: 4px 10px; border: 1px solid #2C3A33; color: #A9B6AD; text-decoration: none">Default</a>
<span aria-current="true" style="padding: 4px 10px; border: 1px solid #4BE38A; background: #0E1F15; color: #4BE38A; font-weight: 700">Terminal</span>
</div>
</div>
</header>

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<main class="tm-main" style="flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="color: #8A978E"><span style="color: #4BE38A">$</span> validators --loading<span class="tm-caret" aria-hidden="true"></span></div>
<sc-for list="{{skel}}" as="s" hint-placeholder-count="8">
<div class="tm-skel" style="height: 26px; background: #0D1210; border: 1px solid #141B17"></div>
</sc-for>
</main>
</sc-if>

<sc-if value="{{failed}}" hint-placeholder-val="{{ false }}">
<main class="tm-main" style="flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 10px">
<div role="alert" style="border: 1px solid #FF6B5E; background: #0B0E0D; padding: 12px"><span style="color: #FF6B5E; font-weight: 700">[FAIL]</span> {{err}}</div>
<div><a href="/terminal" data-on-click="{{home}}" style="padding: 4px 10px; border: 1px solid #2C3A33; color: #D4DDD6; text-decoration: none">‹ back to the list</a></div>
</main>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<main class="tm-main" style="flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px">

<section aria-label="Command" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; white-space: pre-wrap; word-break: break-word"><span style="color: #4BE38A">$</span> <span style="color: #E8F2EA">{{prompt}}</span><span class="tm-caret" aria-hidden="true"></span></div>
<div style="padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<label for="tm-cmd" style="color: #4BE38A; font-weight: 700">&gt;</label>
<input id="tm-cmd" value="{{cmd}}" data-on-input="{{onCmd}}" data-on-keydown="{{onCmdKey}}" aria-label="Command or search" autocomplete="off" spellcheck="false" placeholder="help · sn 51 · root · grade a b · sort fee · v datura" style="flex: 1 1 260px; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA">
<button type="button" class="tm-btn" data-on-click="{{runCmd}}" style="height: 34px; padding: 0 14px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">RUN ⏎</button>
</div>
<div aria-live="polite" style="padding: 0 12px 8px; color: {{fbColor}}; min-height: 20px; word-break: break-word">{{feedback}}</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start">

<aside class="tm-aside" aria-label="Where to stake" style="flex: 1 1 300px; max-width: 360px; min-width: 0; border: 1px solid #1E2622; background: #0B0E0D; display: flex; flex-direction: column">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">┌ where</div>
<div role="group" aria-label="Root or subnet" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 10px 12px">
<button type="button" class="tm-btn" data-on-click="{{pickRoot}}" aria-pressed="{{rootOn}}" style="min-height: 44px; padding: 6px 8px; border: 1px solid {{rootBorder}}; background: {{rootBg}}; color: {{rootFg}}; text-align: left">ROOT<br><span style="color: #8A978E">{{benchTxt}} · no price risk</span></button>
<button type="button" class="tm-btn" data-on-click="{{pickAlpha}}" aria-pressed="{{alphaOn}}" style="min-height: 44px; padding: 6px 8px; border: 1px solid {{alphaBorder}}; background: {{alphaBg}}; color: {{alphaFg}}; text-align: left">SUBNET<br><span style="color: #8A978E">paid in alpha</span></button>
</div>
<sc-if value="{{alphaOn}}" hint-placeholder-val="{{ true }}">
<label style="margin: 0 12px 8px; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border: 1px solid {{snFilterBorder}}; background: #0B0E0D">
<span style="color: #4BE38A; font-weight: 700">filter:</span>
<input id="tm-snq" type="text" autocomplete="off" spellcheck="false" aria-label="Filter subnets by number or name" aria-controls="tm-snrows" placeholder="51 or name" value="{{snQ}}" data-on-change="{{onSnQ}}" data-on-keydown="{{snQKey}}" style="flex: 1; min-width: 0; height: 32px; border: 0; outline: none; background: transparent; color: #E8F2EA">
<span aria-live="polite" style="color: #8A978E; white-space: nowrap">{{snCount}}</span>
</label>
<div class="tm-snlist">
<div style="padding: 0 12px 6px; display: grid; grid-template-columns: 62px minmax(0, 1fr) 62px 70px; gap: 6px; color: #8A978E; text-transform: uppercase; letter-spacing: 0.06em">
<span>SN</span><span>name</span><span style="text-align: right">best</span><span style="text-align: right">px 30d</span>
</div>
<div id="tm-snrows" class="tm-snrows" style="max-height: 1180px; overflow-y: auto; border-top: 1px solid #141B17">
<sc-if value="{{snNone}}" hint-placeholder-val="{{ false }}">
<div style="padding: 8px 12px; color: #F2B544">no subnet matches “{{snQTrim}}”</div>
</sc-if>
<sc-for list="{{snList}}" as="s" hint-placeholder-count="12">
<button type="button" class="tm-row" data-on-click="{{s.pick}}" aria-pressed="{{s.on}}" style="width: 100%; display: grid; grid-template-columns: 62px minmax(0, 1fr) 62px 70px; gap: 6px; align-items: center; padding: 5px 12px; border: 0; border-bottom: 1px solid #111713; background: {{s.bg}}; color: #D4DDD6; text-align: left">
<span style="color: {{s.snFg}}; font-weight: 700">{{s.mark}}SN{{s.nu}}</span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
<span style="text-align: right; color: #E8F2EA">{{s.best}}</span>
<span style="text-align: right; color: #A9B6AD">{{s.dp}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{snMore}}" hint-placeholder-val="{{ true }}">
<button type="button" class="tm-btn" data-on-click="{{showAllSn}}" style="margin: 8px 12px 12px; width: calc(100% - 24px); height: 32px; border: 1px dashed #2C3A33; background: transparent; color: #A9B6AD">-- more -- ({{snTotal}} subnets)</button>
</sc-if>
</div>
</sc-if>
</aside>

<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 12px">

<section aria-label="Summary" style="border: 1px solid #1E2622; background: #0B0E0D; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px">
<span style="padding: 2px 10px; border: 1px solid #4BE38A; color: #4BE38A; font-weight: 700; font-size: 18px">{{sumChip}}</span>
<span style="color: #E8F2EA; font-weight: 700; font-size: 16px">{{sumName}}</span>
<span title="median of the top 3"><span style="color: #8A978E">BEST APY </span><span style="color: #4BE38A">{{sumBest}}</span></span>
<span title="{{sumNetTip}}"><span style="color: #8A978E">{{sumNetLabel}} </span><span style="color: {{sumNetFg}}">{{sumNet}}</span></span>
<sc-if value="{{sumPxLabel}}" hint-placeholder-val="{{ true }}">
<span title="same for every validator on this subnet; grades compare only what validators control"><span style="color: #8A978E">{{sumPxLabel}} </span><span style="color: #A9B6AD">{{sumPx}}</span></span>
</sc-if>
<span><span style="color: #8A978E">VALIDATORS </span><span style="color: #E8F2EA">{{sumN}}</span></span>
</section>

<section id="tm-validators" aria-label="Validators" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px">
<span style="color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">grade</span>
<div role="group" aria-label="Filter by grade" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{gradeChips}}" as="c" hint-placeholder-count="5">
<button type="button" class="tm-btn" data-on-click="{{c.pick}}" aria-pressed="{{c.on}}" aria-label="{{c.aria}}" style="height: 30px; padding: 0 8px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
</sc-for>
</div>
<button type="button" class="tm-btn" data-on-click="{{toggleWarn}}" aria-pressed="{{hideWarn}}" style="height: 30px; padding: 0 8px; border: 1px solid {{warnBorder}}; background: transparent; color: {{warnFg}}">{{warnLabel}}</button>
<label class="tm-msort" style="align-items: center; gap: 4px; height: 30px; padding: 0 6px; border: 1px solid #2C3A33">
<span style="color: #8A978E">sort</span>
<select value="{{sortVal}}" data-on-change="{{pickSort}}" aria-label="Sort by" style="height: 26px; border: 0; background: #0B0E0D; color: #E8F2EA">
<sc-for list="{{sortOpts}}" as="o" hint-placeholder-count="6">
<option value="{{o.v}}">{{o.label}}</option>
</sc-for>
</select>
</label>
<div style="flex: 1 1 auto"></div>
<label for="tm-q" style="color: #8A978E">/</label>
<input id="tm-q" value="{{q}}" data-on-input="{{onQ}}" aria-label="Search name or hotkey" placeholder="search name or hotkey" autocomplete="off" spellcheck="false" style="flex: 0 1 240px; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA">
</div>

<div class="tm-table" style="overflow-x: auto">
<div style="min-width: 900px">
<div style="display: grid; grid-template-columns: {{gridCols}}; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; text-transform: uppercase; letter-spacing: 0.06em">
<span aria-hidden="true"></span>
<sc-for list="{{cols}}" as="h" hint-placeholder-count="7">
<sc-if value="{{h.sortable}}" hint-placeholder-val="{{ true }}">
<button type="button" class="tm-btn" data-on-click="{{h.sort}}" aria-label="{{h.aria}}" aria-pressed="{{h.on}}" aria-sort="{{h.ariaSort}}" style="justify-self: {{h.justify}}; padding: 2px 0; border: 0; border-bottom: 1px solid {{h.uline}}; background: transparent; color: {{h.fg}}; text-transform: uppercase; letter-spacing: 0.06em">{{h.label}} {{h.arrow}}</button>
</sc-if>
<sc-if value="{{h.plain}}" hint-placeholder-val="{{ false }}">
<span style="justify-self: {{h.justify}}">{{h.label}}</span>
</sc-if>
</sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div class="tm-row" aria-current="{{r.current}}" style="display: grid; grid-template-columns: {{gridCols}}; gap: 10px; align-items: center; padding: 5px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}">
<span aria-hidden="true" style="color: #4BE38A; font-weight: 700">{{r.cursor}}</span>
<span title="{{r.gTip}}" style="color: {{r.gFg}}; font-weight: 700">[{{r.grade}}]</span>
<span style="min-width: 0; display: flex; flex-direction: column">
<a id="{{r.id}}" class="tm-name" href="{{r.href}}" data-on-click="{{r.open}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}">{{r.name}}</a>
<span title="{{r.tagTip}}" style="color: {{r.tagFg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.tags}}</span>
</span>
<span style="text-align: right; color: {{r.earnFg}}">{{r.earn}}</span>
<sc-if value="{{showPay}}" hint-placeholder-val="{{ true }}">
<span style="white-space: nowrap; overflow: hidden"><span style="color: {{r.barFg}}">{{r.bar}}</span><span style="color: #2C3A33">{{r.barRest}}</span> <span style="color: {{r.barFg}}">{{r.pr}}</span></span>
</sc-if>
<span style="text-align: right; color: {{r.feeFg}}">{{r.fee}}</span>
<span style="text-align: right; color: #D4DDD6">{{r.stake}}</span>
<sc-if value="{{showPay}}" hint-placeholder-val="{{ true }}">
<span title="{{r.trendTip}}" aria-label="{{r.trendAria}}" style="color: #7FC79A; letter-spacing: 0">{{r.trend}}</span>
</sc-if>
</div>
</sc-for>
</div>
</div>

<div class="tm-cards">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<a id="{{r.cid}}" href="{{r.href}}" data-on-click="{{r.open}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}" style="display: block; padding: 8px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}; color: inherit; text-decoration: none">
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="color: {{r.gFg}}; font-weight: 700">[{{r.grade}}]</span>
<span style="flex: 1; min-width: 0; color: #E8F2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="color: {{r.earnFg}}; font-weight: 700">{{r.earn}}</span>
</span>
<span style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
<sc-if value="{{showPay}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap"><span style="color: {{r.barFg}}">{{r.barS}}</span><span style="color: #2C3A33">{{r.barRestS}}</span> <span style="color: {{r.barFg}}">{{r.pr}}</span></span></sc-if>
<span style="margin-left: auto; color: {{r.feeFg}}">fee {{r.fee}}</span>
<span style="color: #A9B6AD">{{r.stake}}τ</span>
</span>
</a>
</sc-for>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 18px 12px; color: #8A978E">no rows match. <button type="button" class="tm-btn" data-on-click="{{clearAll}}" style="padding: 2px 8px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">clear filters</button></div>
</sc-if>
<div style="padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #8A978E; border-top: 1px solid #1E2622">
<span>{{countTxt}}</span>
<sc-if value="{{more}}" hint-placeholder-val="{{ true }}">
<button type="button" class="tm-btn" data-on-click="{{showMore}}" style="height: 30px; padding: 0 10px; border: 1px dashed #2C3A33; background: transparent; color: #A9B6AD">-- more -- ({{moreN}})</button>
</sc-if>
</div>
</section>

<section aria-label="Calculator" style="border: 1px solid #1E2622; background: #0B0E0D; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<label for="tm-amt" style="color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">calc</label>
<input id="tm-amt" inputmode="decimal" value="{{amt}}" data-on-input="{{onAmt}}" style="width: 110px; height: 30px; padding: 0 8px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA; text-align: right">
<span style="color: #8A978E">τ with</span>
<span style="color: #E8F2EA">{{calcWho}}</span>
<span style="color: #8A978E">→</span>
<span style="color: #4BE38A">{{calcYear}}</span>
<span style="color: #8A978E">|</span>
<span style="color: #A9B6AD">{{calcVs}}</span>
</section>
</div>
</div>

</main>
</sc-if>

<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<main class="tm-main" style="flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<a href="/terminal" data-on-click="{{back}}" style="padding: 4px 10px; border: 1px solid #2C3A33; color: #D4DDD6; text-decoration: none">‹ esc · back</a>
</div>

<sc-if value="{{d.loading}}" hint-placeholder-val="{{ false }}">
<div style="color: #8A978E"><span style="color: #4BE38A">$</span> validator --loading<span class="tm-caret" aria-hidden="true"></span></div>
<sc-for list="{{skel}}" as="s" hint-placeholder-count="5">
<div class="tm-skel" style="height: 26px; background: #0D1210; border: 1px solid #141B17"></div>
</sc-for>
</sc-if>
<sc-if value="{{d.failed}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="border: 1px solid #F2B544; background: #0B0E0D; padding: 12px"><span style="color: #F2B544; font-weight: 700">[WARN]</span> {{d.err}}</div>
</sc-if>

<sc-if value="{{d.ready}}" hint-placeholder-val="{{ true }}">
<section aria-label="Command" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<label for="tm-cmd" style="color: #4BE38A; font-weight: 700">&gt;</label>
<input id="tm-cmd" value="{{cmd}}" data-on-input="{{onCmd}}" data-on-keydown="{{onCmdKey}}" aria-label="Command" autocomplete="off" spellcheck="false" placeholder="sort fee · sort stake asc · sort default · help · back" style="flex: 1 1 260px; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA">
<button type="button" class="tm-btn" data-on-click="{{runCmd}}" style="height: 34px; padding: 0 14px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">RUN ⏎</button>
</div>
<div aria-live="polite" style="padding: 0 12px 8px; color: {{fbColor}}; min-height: 20px; word-break: break-word">{{feedback}}</div>
</section>
<section aria-label="Validator" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; word-break: break-word"><span style="color: #4BE38A">$</span> <span style="color: #E8F2EA">validator {{d.slug}} --at {{d.locArg}}</span></div>
<div style="padding: 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #E8F2EA; word-break: break-word">{{d.name}}</h1>
<span title="{{d.gTip}}" style="color: {{d.gFg}}; font-weight: 700; font-size: 18px">[{{d.grade}}] {{d.locLabel}}</span>
<sc-if value="{{d.nomTxt}}" hint-placeholder-val="{{ false }}">
<span><span style="color: #8A978E">NOMINATORS </span>{{d.nomTxt}}</span>
</sc-if>
</div>
<div style="padding: 0 12px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="color: #8A978E">hotkey</span>
<span style="color: #C3CEC6; word-break: break-all">{{d.hk}}</span>
<button type="button" class="tm-btn" data-on-click="{{d.copy}}" aria-live="polite" style="height: 28px; padding: 0 8px; border: 1px solid #2C3A33; background: transparent; color: #A9B6AD">{{d.copyTxt}}</button>
</div>
</section>

<nav aria-label="Where this validator operates" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{d.tabs}}" as="t" hint-placeholder-count="5">
<button type="button" class="tm-btn" data-on-click="{{t.pick}}" aria-pressed="{{t.on}}" title="{{t.tip}}" style="height: 32px; padding: 0 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}">{{t.label}} <span style="color: {{t.gFg}}; font-weight: 700">[{{t.grade}}]</span></button>
</sc-for>
<sc-if value="{{d.moreLocs}}" hint-placeholder-val="{{ false }}">
<button type="button" class="tm-btn" data-on-click="{{d.goPlaces}}" style="height: 32px; padding: 0 10px; border: 1px dashed #2C3A33; background: transparent; color: #A9B6AD">+{{d.moreLocs}} more ↓</button>
</sc-if>
</nav>

<section aria-label="Verdict" style="border: 1px solid {{d.vBorder}}; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">┌ verdict · {{d.locLong}}</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{d.verdict}}" as="v" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px">
<span style="color: {{v.fg}}; font-weight: 700; white-space: pre">[{{v.tag}}]</span>
<span style="color: #D4DDD6">{{v.text}}</span>
</div>
</sc-for>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
<section aria-label="Key numbers" style="flex: 1 1 360px; min-width: 0; border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">┌ numbers</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{d.kpis}}" as="k" hint-placeholder-count="5">
<div class="tm-kv" title="{{k.tip}}" style="display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px">
<span style="color: #8A978E">{{k.label}}</span>
<span><span style="color: {{k.color}}; font-weight: 700">{{k.value}}</span> <span style="color: #8A978E">{{k.sub}}</span></span>
</div>
</sc-for>
</div>
</section>
<sc-if value="{{d.showFee}}" hint-placeholder-val="{{ false }}">
<section aria-label="Fee breakdown" style="flex: 1 1 300px; min-width: 0; border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">┌ fee breakdown</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; white-space: pre; overflow-x: auto">
<span><span style="color: #8A978E">validator take ...</span> {{d.feeTake}}</span>
<span><span style="color: #8A978E">childkey take ....</span> {{d.feeCk}}</span>
<span aria-hidden="true" style="color: #2C3A33">──────────────────────────</span>
<span><span style="color: #8A978E">total fee ........</span> <span style="color: {{d.feeFg}}; font-weight: 700">{{d.feeTxt}}</span></span>
<span style="color: #8A978E; white-space: normal">already inside the apy · <a href="/terminal/faq#fee">how fees work</a></span>
</div>
</section>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
<sc-if value="{{d.showChart}}" hint-placeholder-val="{{ true }}">
<section aria-label="Payout over time" style="flex: 999 1 560px; min-width: 0; border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; color: #8A978E"><span style="text-transform: uppercase; letter-spacing: 0.08em">┌ payout vs best, over time</span><span>{{d.chartNote}}</span></div>
<div role="img" aria-label="{{d.chartAria}}" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; white-space: pre; overflow-x: auto">
<sc-for list="{{d.bars}}" as="b" hint-placeholder-count="4">
<span aria-hidden="true"><span style="color: #8A978E">{{b.label}}</span> <span style="color: {{b.color}}">{{b.fill}}</span><span style="color: #2C3A33">{{b.rest}}</span> <span style="color: {{b.color}}">{{b.txt}}</span></span>
</sc-for>
<span aria-hidden="true" style="color: #8A978E">{{d.scale}}</span>
</div>
</section>
</sc-if>
<section aria-label="Calculator" style="flex: 1 1 320px; min-width: 0; border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">┌ calc</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<label for="td-amt" style="color: #8A978E">stake</label>
<input id="td-amt" inputmode="decimal" value="{{d.amt}}" data-on-input="{{d.onAmt}}" style="width: 120px; height: 30px; padding: 0 8px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA; text-align: right">
<span style="color: #8A978E">τ</span>
</div>
<span><span style="color: #8A978E">per year .....</span> <span style="color: #4BE38A; font-weight: 700">{{d.calcYear}}</span></span>
<span><span style="color: #8A978E">per month ....</span> {{d.calcMonth}}</span>
<span style="color: #A9B6AD">{{d.calcVs}}</span>
<span style="color: #8A978E">{{d.calcNote}}</span>
</div>
</section>
</div>

<section id="tm-places" aria-label="Where it operates" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; text-transform: uppercase; letter-spacing: 0.08em">┌ where it operates · {{d.placesNote}}</div>
<label class="tm-msort" style="align-items: center; gap: 6px; margin: 8px 12px; height: 30px; padding: 0 6px; border: 1px solid #2C3A33">
<span style="color: #8A978E">sort</span>
<select value="{{d.psortVal}}" data-on-change="{{d.pickPsort}}" aria-label="Sort places by" style="flex: 1; min-width: 0; height: 26px; border: 0; background: #0B0E0D; color: #E8F2EA">
<sc-for list="{{d.psortOpts}}" as="o" hint-placeholder-count="6">
<option value="{{o.v}}">{{o.label}}</option>
</sc-for>
</select>
</label>
<div style="overflow-x: auto">
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: 70px minmax(140px, 1fr) 48px 90px 90px 80px 100px; gap: 10px; padding: 6px 12px; color: #8A978E; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid #1E2622">
<span>where</span><span>name</span>
<sc-for list="{{d.pcols}}" as="h" hint-placeholder-count="5">
<button type="button" class="tm-btn" data-on-click="{{h.sort}}" aria-label="{{h.aria}}" aria-pressed="{{h.on}}" aria-sort="{{h.ariaSort}}" style="justify-self: {{h.justify}}; padding: 0; border: 0; border-bottom: 1px solid {{h.uline}}; background: transparent; color: {{h.fg}}; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap">{{h.label}} {{h.arrow}}</button>
</sc-for>
</div>
<sc-for list="{{d.places}}" as="p" hint-placeholder-count="6">
<button type="button" class="tm-row" data-on-click="{{p.pick}}" aria-pressed="{{p.on}}" style="width: 100%; display: grid; grid-template-columns: 70px minmax(140px, 1fr) 48px 90px 90px 80px 100px; gap: 10px; padding: 5px 12px; border: 0; border-bottom: 1px solid #111713; background: {{p.bg}}; color: #D4DDD6; text-align: left">
<span style="color: {{p.whereFg}}; font-weight: 700">{{p.label}}</span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.sname}}</span>
<span style="color: {{p.gFg}}; font-weight: 700">[{{p.grade}}]</span>
<span style="text-align: right">{{p.apy}}</span>
<span style="text-align: right; color: {{p.gFg}}">{{p.pr}}</span>
<span style="text-align: right; color: {{p.feeFg}}">{{p.fee}}</span>
<span style="text-align: right">{{p.stake}}</span>
</button>
</sc-for>
</div>
</div>
</section>
</sc-if>
</main>
</sc-if>

<footer class="tm-status" aria-label="Status" style="position: sticky; bottom: 0; border-top: 1px solid #1E2622; background: #0B0E0D">
<div style="max-width: 1360px; margin: 0 auto; padding: 6px 20px; display: flex; flex-wrap: wrap; gap: 4px 18px; color: #A9B6AD">
<span><span style="color: #8A978E">BLOCK</span> {{blockTxt}}</span>
<span title="{{tk.title}}"><span style="color: #8A978E">TAO/USDT</span> <span style="color: {{tk.flash}}">{{tk.price}}</span> <span style="color: {{tk.chgColor}}">{{tk.chg}}</span> <span style="color: {{tk.dot}}" aria-hidden="true">●</span> <span style="color: #8A978E">{{tk.status}}</span></span>
<span><span style="color: #8A978E">DATA</span> {{age}}</span>
<span><span style="color: #8A978E">MODE</span> {{modeTxt}}</span>
<span class="tm-hint" style="margin-left: auto; color: #8A978E">{{keysHint}}</span>
<button type="button" class="tm-btn" data-on-click="{{toggleKeys}}" aria-pressed="{{keysOn}}" title="Turn the single-key shortcuts on or off (also: keys on|off)" style="margin-left: 8px; padding: 0 8px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6; font: inherit">{{keysLabel}}</button>
</div>
</footer>
</div>
</template>
<script src="/dc-lite.js?v=0ced284fd338"></script>
<script src="/terminal.js?v=436e17784d49"></script>
</body>
</html>
