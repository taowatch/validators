<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics · Terminal · Validator Yield · Bittensor</title>
<meta name="description" content="Bittensor validators ranked by root and alpha yield, in a keyboard-driven terminal view.">
<meta name="color-scheme" content="dark">
<script src="/ui.js?v=e3d37fbdfb28" data-page="terminal-analytics"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090A}
a{color:#4BE38A}a:hover{color:#9DF5BF}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #4BE38A;outline-offset:1px}
.tm-name{color:#E8F2EA;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-name:hover{color:#4BE38A}
.tm-btn:hover{border-color:#4BE38A !important;color:#E8F2EA !important}
.tm-row:hover{background:#0D1411 !important}
.tm-caret{display:inline-block;width:9px;height:17px;background:#4BE38A;vertical-align:text-bottom;animation:tmblink 1.1s steps(1) infinite}
@keyframes tmblink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.tm-caret{animation:none}}
.tm-cards{display:none}
@media (max-width:899px){
.tm-table,.tm-keys,.tm-hint{display:none !important}
.ta-snrows{max-height:260px !important}
.tm-cards{display:block}
.tm-aside{max-width:none !important}
.tm-main{padding:10px 12px 16px !important}
.tm-hdr{padding:8px 12px !important}
.ta-kpis{grid-template-columns:1fr 1fr !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #07090A; color: #D4DDD6; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column">

<header style="border-bottom: 1px solid #1E2622; background: #07090A">
<div class="tm-hdr" style="max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px">
<a href="/terminal" style="color: #4BE38A; text-decoration: none; font-weight: 700; letter-spacing: 0.02em">▌validator-yield</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<a href="/terminal" style="padding: 4px 10px; color: #A9B6AD; text-decoration: none">‹ choose</a>
<a href="/terminal/analytics" aria-current="page" style="padding: 4px 10px; border: 1px solid #2C3A33; color: #E8F2EA; text-decoration: none">[ analytics ]</a>
<a href="/terminal/faq" style="padding: 4px 10px; color: #A9B6AD; text-decoration: none">faq</a>
<a href="/terminal#v/5FFSBkNiymQWHaxc8dTmfTT7iHoz6YDexVG4xR2yLrffVR86" style="padding: 4px 10px; background: #F2B544; color: #0A0C0B; text-decoration: none; font-weight: 700">STAKE WITH US</a>
</nav>
<div style="flex: 1 1 auto"></div>
<div role="group" aria-label="Interface" style="display: flex; align-items: center; gap: 0">
<span style="color: #8A978E; padding-right: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">UI</span>
<a href="/analytics?ui=default" data-on-click="{{toDefault}}" style="padding: 4px 10px; border: 1px solid #2C3A33; color: #A9B6AD; text-decoration: none">Default</a>
<span aria-current="true" style="padding: 4px 10px; border: 1px solid #4BE38A; background: #0E1F15; color: #4BE38A; font-weight: 700">Terminal</span>
</div>
</div>
</header>

<main class="tm-main" style="flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px">

<section aria-label="Command" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; white-space: pre-wrap; word-break: break-word"><span style="color: #4BE38A">$</span> <span style="color: #E8F2EA">{{prompt}}</span><span class="tm-caret" aria-hidden="true"></span></div>
<div style="padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<label for="ta-cmd" style="color: #4BE38A; font-weight: 700"><span aria-hidden="true">&gt;</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Command</span></label>
<input id="ta-cmd" value="{{cmd}}" data-on-input="{{onCmd}}" data-on-keydown="{{onCmdKey}}" autocomplete="off" spellcheck="false" placeholder="{{cmdHint}}" style="flex: 1 1 420px; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA">
<button type="button" class="tm-btn" data-on-click="{{runCmd}}" style="height: 34px; padding: 0 14px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">RUN ⏎</button>
</div>
<div aria-live="polite" style="padding: 0 12px 8px; color: {{fbColor}}; min-height: 19px">{{feedback}}</div>
</section>

<section class="ta-kpis" aria-label="Key figures" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 0; border: 1px solid #1E2622; background: #0B0E0D">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="5">
<div style="padding: 10px 12px; border-right: 1px solid #141B17; border-bottom: 1px solid #141B17; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">{{k.label}}</span>
<span style="color: {{k.fg}}; font-size: 20px; font-weight: 700">{{k.value}}</span>
<span style="color: #8A978E; font-size: 12px">{{k.sub}}</span>
</div>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<div role="tablist" aria-label="Analytics view" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" class="tm-btn" data-on-click="{{t.pick}}" aria-selected="{{t.on}}" style="height: 34px; padding: 0 12px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-weight: 700">{{t.label}} <span style="color: #8A978E; font-weight: 400">{{t.count}}</span></button>
</sc-for>
</div>
<div style="flex: 1 1 auto"></div>
<span style="color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">window</span>
<div role="group" aria-label="Window" style="display: flex; gap: 4px">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="2">
<button type="button" class="tm-btn" data-on-click="{{w.pick}}" aria-pressed="{{w.on}}" style="height: 30px; padding: 0 10px; border: 1px solid {{w.border}}; background: {{w.bg}}; color: {{w.fg}}">{{w.label}}</button>
</sc-for>
</div>
<span style="color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">min</span>
<div role="group" aria-label="Minimum stake" style="display: flex; gap: 4px">
<sc-for list="{{mins}}" as="m" hint-placeholder-count="4">
<button type="button" class="tm-btn" data-on-click="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 30px; padding: 0 8px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{rootTab}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 12px">

<section aria-label="Commission versus APY" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ take vs apy {{winLbl}} · dot = validator ≥ {{minLbl}}</div>
<div style="padding: 10px 12px 6px 44px; position: relative">
<div role="img" aria-label="{{sc.aria}}" style="position: relative; height: 220px; border-left: 1px solid #2C3A33; border-bottom: 1px solid #2C3A33; background-image: linear-gradient(#111713 1px, transparent 1px), linear-gradient(90deg, #111713 1px, transparent 1px); background-size: 100% 25%, 25% 100%">
<sc-for list="{{sc.dots}}" as="d" hint-placeholder-count="20">
<span title="{{d.tip}}" style="position: absolute; left: {{d.x}}%; bottom: {{d.y}}%; transform: translate(-50%, 50%); color: {{d.fg}}; font-size: {{d.size}}px; line-height: 1">●</span>
</sc-for>
<sc-for list="{{sc.yTicks}}" as="y" hint-placeholder-count="5">
<span style="position: absolute; left: -40px; bottom: {{y.p}}%; transform: translateY(50%); color: #8A978E; font-size: 12px">{{y.t}}</span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; color: #8A978E; font-size: 12px; padding-top: 2px"><span>0%</span><span>5%</span><span>10%</span><span>15%</span><span>20% take</span></div>
</div>
<p style="margin: 0; padding: 0 12px 10px; color: #A9B6AD; font-size: 12px">{{sc.note}}</p>
</section>

<section aria-label="APY distribution" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ apy {{winLbl}} distribution · n={{hist.n}}</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{hist.rows}}" as="h" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 92px minmax(0, 1fr) 34px; gap: 8px; align-items: center; white-space: nowrap">
<span style="color: #8A978E">{{h.range}}</span>
<span style="overflow: hidden"><span style="color: {{h.fg}}">{{h.bar}}</span><span style="color: #4BE38A">{{h.med}}</span></span>
<span style="text-align: right; color: #D4DDD6">{{h.n}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; padding: 0 12px 10px; color: #A9B6AD; font-size: 12px">{{hist.note}}</p>
</section>

<section aria-label="Root stake flows" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ root stake flows · {{flows.span}}</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{flows.rows}}" as="f" hint-placeholder-count="10">
<div class="tm-row" style="display: grid; grid-template-columns: minmax(0, 1fr) 132px 84px; gap: 8px; align-items: center; white-space: nowrap">
<span style="overflow: hidden; text-overflow: ellipsis; color: #E8F2EA">{{f.name}}</span>
<span style="color: {{f.fg}}; overflow: hidden">{{f.bar}}</span>
<span style="text-align: right; color: {{f.fg}}">{{f.val}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; padding: 0 12px 10px; color: #8A978E; font-size: 12px"># flows are stake moving in or out, not performance.</p>
</section>
</div>

<section aria-label="Root validators" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px">
<span style="color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ root stake · ranked by apy {{winLbl}}</span>
<div style="flex: 1 1 auto"></div>
<label for="ta-q1" style="color: #8A978E">/</label>
<input id="ta-q1" value="{{q}}" data-on-input="{{onQ}}" placeholder="search name or hotkey" autocomplete="off" spellcheck="false" style="flex: 0 1 240px; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA">
</div>
<div class="tm-table" style="overflow-x: auto">
<div style="min-width: 1080px">
<div style="display: grid; grid-template-columns: 40px minmax(180px, 1.6fr) 104px 56px 76px 76px 108px 112px 64px 64px; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">
<sc-for list="{{rCols}}" as="h" hint-placeholder-count="10">
<sc-if value="{{h.sortable}}" hint-placeholder-val="{{ true }}">
<button type="button" class="tm-btn" data-on-click="{{h.sort}}" aria-label="{{h.aria}}" aria-pressed="{{h.on}}" style="justify-self: {{h.justify}}; padding: 2px 0; border: 0; border-bottom: 1px solid {{h.uline}}; background: transparent; color: {{h.fg}}; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">{{h.label}}{{h.arrow}}</button>
</sc-if>
<sc-if value="{{h.plain}}" hint-placeholder-val="{{ false }}">
<span style="justify-self: {{h.justify}}">{{h.label}}</span>
</sc-if>
</sc-for>
</div>
<sc-for list="{{rRows}}" as="r" hint-placeholder-count="12">
<div class="tm-row" style="display: grid; grid-template-columns: 40px minmax(180px, 1.6fr) 104px 56px 76px 76px 108px 112px 64px 64px; gap: 10px; align-items: center; padding: 5px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}">
<span style="color: {{r.rankFg}}; font-weight: 700">{{r.cur}}{{r.rank}}</span>
<span style="min-width: 0; display: flex; flex-direction: column">
<a id="{{r.id}}" class="tm-name" href="{{r.href}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}">{{r.name}}</a>
<span style="font-size: 12px; color: #8A978E">{{r.hk}}</span>
</span>
<span style="text-align: right">{{r.stake}}</span>
<span style="text-align: right; color: {{r.takeFg}}">{{r.take}}</span>
<span style="text-align: right; color: {{r.a7Fg}}">{{r.a7}}</span>
<span style="text-align: right; color: {{r.a30Fg}}; font-weight: {{r.a30W}}">{{r.a30}}</span>
<span title="{{r.trendTip}}" style="color: #7FC79A">{{r.trend}}</span>
<span style="text-align: right; color: #A9B6AD">{{r.flow}}</span>
<span style="text-align: right; color: #A9B6AD">{{r.sd}}</span>
<span style="text-align: right; color: #A9B6AD">{{r.nom}}</span>
</div>
</sc-for>
</div>
</div>
<div class="tm-cards">
<sc-for list="{{rRows}}" as="r" hint-placeholder-count="8">
<a id="{{r.cid}}" href="{{r.href}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}" style="display: block; padding: 8px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}; color: inherit; text-decoration: none">
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="color: {{r.rankFg}}; font-weight: 700">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; color: #E8F2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="color: {{r.a30Fg}}; font-weight: 700">{{r.a30}}</span>
</span>
<span style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #A9B6AD">
<span style="color: #7FC79A">{{r.trend}}</span>
<span style="color: {{r.takeFg}}">take {{r.take}}</span>
<span>{{r.stake}} τ</span>
<span style="margin-left: auto">flow {{r.flow}}</span>
</span>
</a>
</sc-for>
</div>
<div style="padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #8A978E; border-top: 1px solid #1E2622">
<span>{{rCount}}</span>
<sc-if value="{{rMore}}" hint-placeholder-val="{{ true }}">
<button type="button" class="tm-btn" data-on-click="{{showMore}}" style="height: 30px; padding: 0 10px; border: 1px dashed #2C3A33; background: transparent; color: #A9B6AD">-- more -- ({{rMoreN}})</button>
</sc-if>
<span style="margin-left: auto"># apy net of commission · σ = spread of the rolling 7d apy, in pp</span>
</div>
</section>
</sc-if>

<sc-if value="{{alphaTab}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start">
<aside class="tm-aside tm-snlist" aria-label="Subnets" style="flex: 1 1 300px; max-width: 380px; min-width: 0; border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ subnets · ref apy {{winLbl}}</div>
<label style="margin: 8px 12px; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; border: 1px solid {{snFilterBorder}}; background: #07090A">
<span style="color: #4BE38A; font-weight: 700">filter:</span>
<input id="ta-snq" type="text" autocomplete="off" spellcheck="false" aria-label="Filter subnets by number or name" aria-controls="ta-snrows" placeholder="51 or name" value="{{snQ}}" data-on-input="{{onSnQ}}" data-on-keydown="{{snQKey}}" style="flex: 1; min-width: 0; height: 30px; border: 0; outline: none; background: transparent; color: #E8F2EA">
<span aria-live="polite" style="color: #8A978E; white-space: nowrap">{{snCount}}</span>
</label>
<div style="padding: 6px 12px; display: grid; grid-template-columns: 56px minmax(0, 1fr) 66px 70px; gap: 6px; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">
<span>SN</span><span>name</span><span style="text-align: right">ref</span><span style="text-align: right">px {{winLbl}}</span>
</div>
<div id="ta-snrows" class="ta-snrows" style="max-height: 760px; overflow-y: auto; border-top: 1px solid #141B17">
<sc-for list="{{snList}}" as="s" hint-placeholder-count="14">
<button type="button" class="tm-row" data-on-click="{{s.pick}}" aria-pressed="{{s.on}}" style="width: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr) 66px 70px; gap: 6px; align-items: center; padding: 5px 12px; border: 0; border-bottom: 1px solid #111713; background: {{s.bg}}; color: #D4DDD6; text-align: left">
<span style="color: {{s.snFg}}; font-weight: 700">{{s.mark}}SN{{s.nu}}</span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
<span style="text-align: right; color: #E8F2EA">{{s.ref}}</span>
<span style="text-align: right; color: #A9B6AD">{{s.dp}}</span>
</button>
</sc-for>
<sc-if value="{{snEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 12px; color: #F2B544">no subnet matches "{{snEmptyQ}}"</div>
</sc-if>
</div>
</aside>

<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<section aria-label="Subnet summary" style="border: 1px solid #1E2622; background: #0B0E0D; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px">
<span style="padding: 2px 10px; border: 1px solid #4BE38A; color: #4BE38A; font-weight: 700; font-size: 18px">SN{{cur.nu}}</span>
<sc-if value="{{noCur}}" hint-placeholder-val="{{ false }}"><span style="color: #8A978E">{{noCurTxt}}</span></sc-if>
<span style="color: #E8F2EA; font-weight: 700; font-size: 16px">{{cur.name}}</span>
<span><span style="color: #8A978E">REF APY </span><span style="color: #4BE38A">{{cur.ref}}</span> <span style="color: #F2B544">{{cur.thin}}</span></span>
<span><span style="color: #8A978E">PRICE </span><span style="color: #A9B6AD">{{cur.price}}</span></span>
<span><span style="color: #8A978E">RANKED </span><span style="color: #E8F2EA">{{cur.n}}</span></span>
<span><span style="color: #8A978E">STAKED </span><span style="color: #E8F2EA">{{cur.tao}}</span></span>
</div>
<p style="margin: 0; color: #A9B6AD"># {{cur.line}}</p>
</section>
<section aria-label="Validators on this subnet" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ validators on SN{{cur.nu}} · ranked by apy {{winLbl}}</div>
<div class="tm-table" style="overflow-x: auto">
<div style="min-width: 860px">
<div style="display: grid; grid-template-columns: 52px minmax(170px, 1.6fr) 100px 72px 72px minmax(180px, 1.3fr) 64px; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">
<span>#</span><span>validator</span><span style="text-align: right">stake</span><span style="text-align: right">apy 7d</span><span style="text-align: right">apy {{winLbl}}</span><span>yield vs best {{winLbl}}</span><span style="text-align: right">child</span>
</div>
<sc-for list="{{pRows}}" as="r" hint-placeholder-count="12">
<div class="tm-row" style="display: grid; grid-template-columns: 52px minmax(170px, 1.6fr) 100px 72px 72px minmax(180px, 1.3fr) 64px; gap: 10px; align-items: center; padding: 5px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}">
<span style="color: {{r.rankFg}}; font-weight: 700">{{r.cur}}{{r.rank}}</span>
<span style="min-width: 0; display: flex; flex-direction: column">
<a id="{{r.id}}" class="tm-name" href="{{r.href}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}">{{r.name}}</a>
<span style="font-size: 12px; color: {{r.tagFg}}">{{r.tags}}</span>
</span>
<span style="text-align: right">{{r.stake}}</span>
<span style="text-align: right; color: {{r.a7Fg}}">{{r.a7}}</span>
<span style="text-align: right; color: {{r.a30Fg}}">{{r.a30}}</span>
<span style="white-space: nowrap; overflow: hidden"><span style="color: {{r.barFg}}">{{r.bar}}</span><span style="color: #2C3A33">{{r.barRest}}</span> <span style="color: {{r.barFg}}">{{r.eff}}</span></span>
<span style="text-align: right; color: #A9B6AD">{{r.ct}}</span>
</div>
</sc-for>
</div>
</div>
<div class="tm-cards">
<sc-for list="{{pRows}}" as="r" hint-placeholder-count="8">
<a id="{{r.cid}}" href="{{r.href}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}" style="display: block; padding: 8px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}; color: inherit; text-decoration: none">
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="color: {{r.rankFg}}; font-weight: 700">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; color: #E8F2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="color: {{r.a30Fg}}; font-weight: 700">{{r.a30}}</span>
</span>
<span style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 12px">
<span style="white-space: nowrap"><span style="color: {{r.barFg}}">{{r.bar}}</span><span style="color: #2C3A33">{{r.barRest}}</span> <span style="color: {{r.barFg}}">{{r.eff}}</span></span>
<span style="color: {{r.tagFg}}">{{r.tags}}</span>
<span style="margin-left: auto; color: #A9B6AD">{{r.stake}}</span>
</span>
</a>
</sc-for>
</div>
<div style="padding: 8px 12px; color: #8A978E; border-top: 1px solid #1E2622">{{pCount}}</div>
</section>
</div>
</div>
</sc-if>

<sc-if value="{{effTab}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 12px">
<section aria-label="Listed take versus gap" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ listed take vs gap to best {{winLbl}}</div>
<div style="padding: 10px 12px 6px 44px">
<div role="img" aria-label="{{es.aria}}" style="position: relative; height: 220px; border-left: 1px solid #2C3A33; border-bottom: 1px solid #2C3A33; background-image: linear-gradient(#111713 1px, transparent 1px), linear-gradient(90deg, #111713 1px, transparent 1px); background-size: 100% 25%, 25% 100%">
<span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 100%; height: 20%; background: linear-gradient(to top left, transparent calc(50% - 1px), #3E5C4A calc(50% - 1px), #3E5C4A calc(50% + 1px), transparent calc(50% + 1px))"></span>
<sc-for list="{{es.dots}}" as="d" hint-placeholder-count="20">
<span title="{{d.tip}}" style="position: absolute; left: {{d.x}}%; bottom: {{d.y}}%; transform: translate(-50%, 50%); color: {{d.fg}}; font-size: {{d.size}}px; line-height: 1">●</span>
</sc-for>
<span style="position: absolute; left: -40px; bottom: 0; transform: translateY(50%); color: #8A978E; font-size: 12px">0%</span>
<span style="position: absolute; left: -40px; bottom: 50%; transform: translateY(50%); color: #8A978E; font-size: 12px">50%</span>
<span style="position: absolute; left: -40px; bottom: 100%; transform: translateY(50%); color: #8A978E; font-size: 12px">100%</span>
</div>
<div style="display: flex; justify-content: space-between; color: #8A978E; font-size: 12px; padding-top: 2px"><span>0%</span><span>5%</span><span>10%</span><span>15%</span><span>20% listed take</span></div>
</div>
<p style="margin: 0; padding: 0 12px 10px; color: #A9B6AD; font-size: 12px"># dots above the diagonal trail the best pools by more than their listed take explains (childkey take or missed rewards). not-earning validators are left out.</p>
</section>
<section aria-label="Biggest gap to peers" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ biggest gap to peers · gap − listed take</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{gaps}}" as="g" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px 70px; gap: 8px; align-items: center; white-space: nowrap">
<span style="min-width: 0; display: flex; flex-direction: column">
<span style="color: #E8F2EA; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
<span style="color: #8A978E; font-size: 12px">listed {{g.take}} → gap {{g.gap}}</span>
</span>
<span style="color: #F2B544; overflow: hidden">{{g.bar}}</span>
<span style="text-align: right; color: #F2B544">{{g.pp}}</span>
</div>
</sc-for>
<sc-if value="{{noGaps}}" hint-placeholder-val="{{ false }}">
<span style="color: #8A978E">[  OK] no validator in this filter trails its peers by more than its take.</span>
</sc-if>
</div>
</section>
</div>

<sc-if value="{{neNote}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; color: #A9B6AD"><span style="color: #FF6B5E">[FAIL]</span> {{neTxt}}</p>
</sc-if>

<section aria-label="Validator efficiency" style="border: 1px solid #1E2622; background: #0B0E0D">
<div style="padding: 8px 12px; border-bottom: 1px solid #1E2622; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px">
<span style="color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">┌ yield vs best pools on the same subnets · {{winLbl}}</span>
<div style="flex: 1 1 auto"></div>
<label for="ta-q2" style="color: #8A978E">/</label>
<input id="ta-q2" value="{{q}}" data-on-input="{{onQ}}" placeholder="search name or hotkey" autocomplete="off" spellcheck="false" style="flex: 0 1 240px; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid #2C3A33; background: #07090A; color: #E8F2EA">
</div>
<div class="tm-table" style="overflow-x: auto">
<div style="min-width: 1100px">
<div style="display: grid; grid-template-columns: 40px minmax(190px, 1.6fr) 104px 64px 64px 72px minmax(190px, 1.3fr) 80px 92px; gap: 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #1E2622; color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">
<sc-for list="{{eCols}}" as="h" hint-placeholder-count="9">
<sc-if value="{{h.sortable}}" hint-placeholder-val="{{ true }}">
<button type="button" class="tm-btn" data-on-click="{{h.sort}}" aria-label="{{h.aria}}" aria-pressed="{{h.on}}" style="justify-self: {{h.justify}}; padding: 2px 0; border: 0; border-bottom: 1px solid {{h.uline}}; background: transparent; color: {{h.fg}}; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em">{{h.label}}{{h.arrow}}</button>
</sc-if>
<sc-if value="{{h.plain}}" hint-placeholder-val="{{ false }}">
<span style="justify-self: {{h.justify}}">{{h.label}}</span>
</sc-if>
</sc-for>
</div>
<sc-for list="{{eRows}}" as="r" hint-placeholder-count="12">
<div class="tm-row" style="display: grid; grid-template-columns: 40px minmax(190px, 1.6fr) 104px 64px 64px 72px minmax(190px, 1.3fr) 80px 92px; gap: 10px; align-items: center; padding: 5px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}">
<span style="color: {{r.rankFg}}; font-weight: 700">{{r.cur}}{{r.rank}}</span>
<span style="min-width: 0; display: flex; flex-direction: column">
<a id="{{r.id}}" class="tm-name" href="{{r.href}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}">{{r.name}}</a>
<span style="font-size: 12px; color: {{r.tagFg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.tags}}</span>
</span>
<span style="text-align: right">{{r.tao}}</span>
<span style="text-align: right; color: #A9B6AD">{{r.ns}}</span>
<span style="text-align: right; color: {{r.takeFg}}">{{r.take}}</span>
<span style="text-align: right; color: {{r.cfgFg}}">{{r.cfg}}</span>
<span style="white-space: nowrap; overflow: hidden"><span style="color: {{r.barFg}}">{{r.bar}}</span><span style="color: #2C3A33">{{r.barRest}}</span> <span style="color: {{r.barFg}}">{{r.eff}}</span></span>
<span style="text-align: right; color: {{r.gapFg}}">{{r.gap}}</span>
<span title="set by the subnets this validator stakes on; shared by every validator there" style="text-align: right; color: #8A978E">{{r.px}}</span>
</div>
</sc-for>
</div>
</div>
<div class="tm-cards">
<sc-for list="{{eRows}}" as="r" hint-placeholder-count="8">
<a id="{{r.cid}}" href="{{r.href}}" data-on-focus="{{r.focus}}" aria-label="{{r.aria}}" style="display: block; padding: 8px 12px; border-bottom: 1px solid #111713; background: {{r.bg}}; color: inherit; text-decoration: none">
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="color: {{r.rankFg}}; font-weight: 700">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; color: #E8F2EA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="color: {{r.barFg}}; font-weight: 700">{{r.eff}}</span>
</span>
<span style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #A9B6AD">
<span style="white-space: nowrap"><span style="color: {{r.barFg}}">{{r.bar}}</span><span style="color: #2C3A33">{{r.barRest}}</span></span>
<span style="color: {{r.cfgFg}}">fee {{r.cfg}}</span>
<span>{{r.tao}}</span>
<span style="color: {{r.tagFg}}">{{r.tags}}</span>
</span>
</a>
</sc-for>
</div>
<div style="padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #8A978E; border-top: 1px solid #1E2622">
<span>{{eCount}}</span>
<sc-if value="{{eMore}}" hint-placeholder-val="{{ true }}">
<button type="button" class="tm-btn" data-on-click="{{showMore}}" style="height: 30px; padding: 0 10px; border: 1px dashed #2C3A33; background: transparent; color: #A9B6AD">-- more -- ({{eMoreN}})</button>
</sc-if>
<span style="margin-left: auto"># 100% = earns what the top pools on its subnets earn; not the fee charged. price = alpha price move, grey: not set by validators.</span>
</div>
</section>
</sc-if>

<section class="tm-keys" aria-label="Keyboard shortcuts" style="border: 1px solid #1E2622; background: #0B0E0D; padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; color: #A9B6AD">
<span style="color: #8A978E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em">keys</span>
<button type="button" class="tm-btn" data-on-click="{{tab1}}" style="padding: 2px 8px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">1</button><span>root</span>
<button type="button" class="tm-btn" data-on-click="{{tab2}}" style="padding: 2px 8px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">2</button><span>alpha</span>
<button type="button" class="tm-btn" data-on-click="{{tab3}}" style="padding: 2px 8px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">3</button><span>efficiency</span>
<button type="button" class="tm-btn" data-on-click="{{toggleWin}}" style="padding: 2px 8px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6">w</button><span>window</span>
<span style="padding: 2px 8px; border: 1px solid #2C3A33">j/k</span><span>move</span>
<span style="padding: 2px 8px; border: 1px solid #2C3A33">enter</span><span>open</span>
<span style="padding: 2px 8px; border: 1px solid #2C3A33">/</span><span>command</span>
<span style="padding: 2px 8px; border: 1px solid #2C3A33">esc</span><span>clear</span>
<a href="/analytics?ui=default" data-on-click="{{toDefault}}" style="padding: 2px 8px; border: 1px solid #2C3A33; color: #D4DDD6; text-decoration: none">t</a><span>default UI</span>
<span style="color: #8A978E">· single keys can be turned off in the status bar (keys: on/off)</span>
</section>
</main>

<footer aria-label="Status" style="border-top: 1px solid #1E2622; background: #0B0E0D">
<div style="max-width: 1360px; margin: 0 auto; padding: 6px 20px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: #A9B6AD">
<span><span style="color: #8A978E">BLOCK</span> {{block}}</span>
<span title="{{tk.title}}"><span style="color: #8A978E">TAO/USDT</span> <span style="color: {{tk.flash}}">{{tk.price}}</span> <span style="color: {{tk.chgColor}}">{{tk.chg}}</span> <span style="color: {{tk.dot}}" aria-hidden="true">●</span> <span style="color: #8A978E">{{tk.status}}</span></span>
<span><span style="color: #8A978E">DATA</span> {{age}}</span>
<span><span style="color: #8A978E">VIEW</span> {{viewTxt}}</span>
<span class="tm-hint" style="margin-left: auto; color: #8A978E">{{keysHint}}</span>
<button type="button" class="tm-btn" data-on-click="{{toggleKeys}}" aria-pressed="{{keysOn}}" title="Turn the single-key shortcuts on or off (also: keys on|off)" style="margin-left: 8px; padding: 0 8px; border: 1px solid #2C3A33; background: transparent; color: #D4DDD6; font: inherit">{{keysLabel}}</button>
</div>
</footer>
</div>
</template>
<script src="/dc-lite.js?v=0ced284fd338"></script>
<script src="/terminal-analytics.js?v=fa5a79256ccc"></script>
</body>
</html>
