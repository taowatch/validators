<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Validator Ranking — Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E13}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #3DDBB0;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0E13; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #1C232D">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 30px; height: 30px; border-radius: 8px; background: {{accent}}; color: #0A0E13; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px" aria-hidden="true">τ</div>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">Root Yield</span>
<span style="flex: 1"></span>
<span title="Binance TAO/USDT" style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px">
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{tk.dot}}" aria-hidden="true"></span>
<span style="font-weight: 600">{{tk.price}}</span>
<span style="color: {{tk.chgColor}}">{{tk.chg}}</span>
</span>
</div>
<div style="display: flex; gap: 8px">
<div style="flex: 1; background: #0E131A; border: 1px solid #1C232D; border-radius: 10px; padding: 10px 12px">
<div style="font-size: 11px; color: #8B97A6">Median 30D</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; color: #7AA2F7">{{medTxt}}</div>
</div>
<div style="flex: 1; background: #0E131A; border: 1px solid #1C232D; border-radius: 10px; padding: 10px 12px">
<div style="font-size: 11px; color: #8B97A6">Best 30D</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; color: {{accent}}">{{bestTxt}}</div>
</div>
</div>
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search validators</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B97A6" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 12px" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Name or hotkey…" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px 0 36px; background: #0E131A; border: 1px solid #232C38; border-radius: 10px; color: #E6EDF3; font: inherit">
</label>
<div role="group" aria-label="APY window" style="display: flex; gap: 4px; padding: 4px; background: #0E131A; border: 1px solid #232C38; border-radius: 10px">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="3">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="flex: 1; height: 36px; border: 0; border-radius: 7px; background: {{w.bg}}; color: {{w.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600">APY {{w.label}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 0; text-align: center; color: #8B97A6">Loading data…</div>
</sc-if>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<div style="background: #0E131A; border: 1px solid #1C232D; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: {{c.rankColor}}; width: 22px">{{c.rank}}</span>
<span style="flex: none; width: 32px; height: 32px; border-radius: 8px; background: {{c.monoBg}}; color: {{c.monoFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px" aria-hidden="true">{{c.ini}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B97A6">{{c.stake}} τ · take {{c.take}}</span>
</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; color: {{c.apyColor}}">{{c.apy}}</span>
</div>
<svg viewBox="0 0 100 28" preserveAspectRatio="none" style="width: 100%; height: 26px" aria-hidden="true">
<line x1="0" x2="100" y1="{{medY}}" y2="{{medY}}" stroke="#2A3646" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"></line>
<path d="{{c.spark}}" fill="none" stroke="{{accent}}" stroke-width="1.6" vector-effect="non-scaling-stroke"></path>
</svg>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DDBB0","options":["#3DDBB0","#7AA2F7","#E8C35A","#C792EA"]},"$preview":{"width":390,"height":844}}'>
const DATA_URL = '/_blob/1400cc003e3196f0955d70ff4c6aaf5a';
const PRICE_WS = 'wss://data-stream.binance.vision/ws/taousdt@ticker';
const PRICE_SNAPSHOT = { c: 185.10, P: 3.989 };
function pct(x, d) { return x == null ? '—' : x.toFixed(d == null ? 2 : d) + '%'; }
function hue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function median(xs) { const a = xs.filter((x) => x != null).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
function fmtK(n) { const a = Math.abs(n); if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M'; if (a >= 1e3) return (n / 1e3).toFixed(1) + 'K'; return n.toFixed(0); }
function spark(arr) {
  let d = '', pen = false; const n = arr.length;
  arr.forEach((v, i) => { if (v == null) { pen = false; return; } const y = 28 - Math.max(0, Math.min(10, v)) / 10 * 28; d += (pen ? 'L' : 'M') + (i / (n - 1) * 100).toFixed(1) + ' ' + y.toFixed(1) + ' '; pen = true; });
  return d.trim();
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { data: null, q: '', win: 'a30', px: null, live: false }; }
  connectPrice() {
    if (this.dead || typeof WebSocket === 'undefined') return;
    let ws;
    try { ws = new WebSocket(PRICE_WS); } catch (e) { this.retry(); return; }
    this.ws = ws;
    ws.onopen = () => { this.tries = 0; };
    ws.onmessage = (ev) => { try { const m = JSON.parse(ev.data); const c = parseFloat(m.c); if (isFinite(c)) this.setState({ live: true, px: { c, P: parseFloat(m.P) } }); } catch (e) { /* ignore */ } };
    ws.onclose = () => { if (this.ws === ws) { this.ws = null; this.setState({ live: false }); this.retry(); } };
    ws.onerror = () => { try { ws.close(); } catch (e) { /* ignore */ } };
  }
  retry() { if (this.dead) return; this.tries = (this.tries || 0) + 1; clearTimeout(this.timer); this.timer = setTimeout(() => this.connectPrice(), Math.min(30000, 1000 * 2 ** this.tries)); }
  componentWillUnmount() { this.dead = true; clearTimeout(this.timer); if (this.ws) { const w = this.ws; this.ws = null; try { w.close(); } catch (e) { /* ignore */ } } }
  componentDidMount() { this.connectPrice(); fetch(DATA_URL).then((r) => r.json()).then((d) => this.setState({ data: d })).catch(() => {}); }
  renderVals() {
    const accent = this.props.accent ?? '#3DDBB0';
    const S = this.state, D = S.data, win = S.win;
    const wins = [['a1', '1D'], ['a7', '7D'], ['a30', '30D']].map(([k, l]) => ({ label: l, on: k === win, bg: k === win ? accent : 'transparent', fg: k === win ? '#0A0E13' : '#A9B4C2', pick: () => this.setState({ win: k }) }));
    const p = S.px || PRICE_SNAPSHOT;
    const tk = { price: '$' + p.c.toFixed(2), chg: (p.P >= 0 ? '+' : '−') + Math.abs(p.P).toFixed(2) + '%', chgColor: p.P >= 0 ? accent : '#F59E3B', dot: S.live ? accent : '#5B6675' };
    const base = { accent, tk, wins, q: S.q, onQ: (e) => this.setState({ q: e.target.value }), loading: !D };
    if (!D) return Object.assign(base, { cards: [], blockTxt: '…', medTxt: '—', bestTxt: '—', medY: 14 });
    const big = D.v.filter((x) => x.s >= 1000);
    const m = median(big.map((x) => x[win]));
    const m30 = median(big.map((x) => x.a30));
    const ranked = big.filter((x) => x[win] != null).sort((a, b) => b[win] - a[win]);
    const q = S.q.trim().toLowerCase();
    const cards = ranked.map((x, i) => Object.assign({ rank: i + 1 }, x))
      .filter((x) => !q || (x.n || '').toLowerCase().includes(q) || x.hk.toLowerCase().includes(q))
      .slice(0, 40)
      .map((x) => {
        const h = hue(x.hk);
        const v = x[win];
        return {
          rank: x.rank, rankColor: x.rank <= 3 ? accent : '#8B97A6',
          name: x.n || x.hk.slice(0, 6) + '…' + x.hk.slice(-4),
          ini: ((x.n || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 2) || x.hk.slice(1, 3)).toUpperCase(),
          monoBg: 'hsl(' + h + ' 34% 20%)', monoFg: 'hsl(' + h + ' 70% 78%)',
          stake: fmtK(x.s), take: pct(x.t * 100, 0), apy: pct(v),
          apyColor: v >= m + 0.4 ? accent : v < m - 1 ? '#F59E3B' : '#E6EDF3',
          spark: spark(x.d),
        };
      });
    return Object.assign(base, {
      cards, blockTxt: D.block.toLocaleString('en-US'), medTxt: pct(m30), bestTxt: pct(big.reduce((a, x) => Math.max(a, x.a30 ?? 0), 0)),
      medY: (28 - Math.max(0, Math.min(10, m30 || 0)) / 10 * 28).toFixed(1),
    });
  }
}
</script>
</body>
</html>
